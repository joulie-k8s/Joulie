# Source: joulie/templates/agent-statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: joulie-agent-pool
  namespace: default
spec:
  serviceName: joulie-agent-metrics
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: joulie-agent
      app.kubernetes.io/component: pool
  template:
    metadata:
      labels:
        app.kubernetes.io/name: joulie-agent
        app.kubernetes.io/component: pool
    spec:
      serviceAccountName: joulie-agent
      containers:
        - name: agent
          image: "registry.cern.ch/joulie/joulie-agent:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          env:
            - name: AGENT_MODE
              value: "pool"
            - name: POOL_NODE_SELECTOR
              value: "joulie.io/managed=true"
            - name: POOL_SHARDS
              value: "2"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GOVERNOR_RESTORE_ON_EXIT
              value: "true"
            - name: GOVERNOR_WRITES
              value: "false"
            - name: METRICS_ADDR
              value: ":8080"
            - name: RECONCILE_INTERVAL
              value: "20s"
            - name: SIMULATE_ONLY
              value: "false"
