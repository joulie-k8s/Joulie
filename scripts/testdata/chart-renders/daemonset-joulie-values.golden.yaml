# Source: joulie/templates/agent-daemonset.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: joulie-agent
  namespace: default
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: joulie-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: joulie-agent
    spec:
      serviceAccountName: joulie-agent
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        joulie.io/managed: "true"
      tolerations:
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Exists
        - effect: NoSchedule
          key: amd.com/gpu
          operator: Exists
      containers:
        - name: agent
          image: "registry.cern.ch/joulie/joulie-agent:latest"
          imagePullPolicy: Always
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: GOVERNOR_RESTORE_ON_EXIT
              value: "true"
            - name: GOVERNOR_WRITES
              value: "false"
            - name: METRICS_ADDR
              value: ":8080"
            - name: RECONCILE_INTERVAL
              value: "20s"
            - name: SIMULATE_ONLY
              value: "false"
          securityContext:
            privileged: true
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: true
          volumeMounts:
            - name: host-sys
              mountPath: /host-sys
      volumes:
        - name: host-sys
          hostPath:
            path: /sys
            type: Directory
