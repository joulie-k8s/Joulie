# OpenTelemetry Collector for the otel-bridge telemetry mode: the bridge of
# examples/11-otel-collector-bridge, run unchanged. The simulator pushes no
# OTLP in this mode and serves the Kepler 0.12, dcgm-exporter 4.8.4 and AMD
# device-metrics-exporter 1.5.2 formats instead; the Collector scrapes them,
# rewrites their series as hw.* and pushes them over OTLP to Prometheus.
#
# The image is the contrib build referenced by the tag in versions.env
# (OTELCOL_CONTRIB_IMAGE): the bridge needs its transform and groupbyattrs
# processors. images.sh imports it by tag after checking its digest.
#
# The configuration is not in this file. up.sh applies ConfigMap
# otelcol-bridge-config with two keys: collector.yaml, the example's file as
# it is, and config.yaml, which `simcluster telemetry --part otelcol-config
# --mode otel-bridge` generates. The Collector reads them in that order and
# replaces lists whole, so config.yaml points the example's scrape jobs at
# the simulator's exporters, in place of its pod discovery, turns on the
# health_check extension the readiness probe reads, and leaves everything
# else as the example has it.
#
# One replica: every replica scrapes every exporter, so a second would push
# each series twice. No Service: nothing connects to the Collector. Apply
# this after prometheus.yaml, which creates the monitoring namespace; the
# scripts delete it in every other mode, since it would go on pushing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otelcol-bridge
  namespace: monitoring
  labels:
    app.kubernetes.io/name: otelcol-bridge
    app.kubernetes.io/part-of: joulie-simcluster
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: otelcol-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otelcol-bridge
        app.kubernetes.io/part-of: joulie-simcluster
    spec:
      nodeSelector:
        joulie.io/infra: "true"
      containers:
        - name: otelcol
          image: otel/opentelemetry-collector-contrib:0.162.0
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/otelcol/collector.yaml
            - --config=/etc/otelcol/config.yaml
          ports:
            - name: health
              containerPort: 13133
          readinessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 1
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: otelcol-bridge-config
