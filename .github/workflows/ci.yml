name: ci

# Every pull request, whatever its base branch. A PR stacked on another feature
# branch used to get no unit tests and no helm lint, which is how a chart that
# rendered a template twice reached main once.
#
# Each job runs one function of the Dagger module in ci/, so
# `dagger -m ./ci call <function>` runs the same job on any machine with
# Docker, in the same pinned images (ci/README.md). The Dagger version is the
# module's engineVersion (ci/dagger.json); tests/contracts checks both.
on:
  pull_request:
  push:
    branches: [main]
  # The nightly vulnerability scan dispatches it on the branch of its fixes,
  # whose pull request, opened with GITHUB_TOKEN, starts no pull_request run.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # go mod tidy -diff for both modules, make verify-manifests and
  # verify-fmt, go build, go vet, and go test ./... with the FUSE tests
  # required.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: "0.21.10"
          verb: call
          module: ./ci
          args: test --source=.
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}

  # go test -race over ./cmd/... and the simulator, which CLAUDE.md asks
  # for whenever a change touches caches or goroutines; a job of its own,
  # since the race detector makes the tests several times slower.
  race:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Race detector
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: "0.21.10"
          verb: call
          module: ./ci
          args: race --source=.
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}

  # helm lint of both charts, and scripts/verify-chart-renders.sh, which
  # renders the chart under the value combinations that have broken before
  # (defaults, the deprecated operator: key, leader election, agent pool
  # mode) and asserts the workload objects.
  helm:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint and render the charts
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: "0.21.10"
          verb: call
          module: ./ci
          args: helm --source=.
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}

  # envtest runs the Go tests behind the "envtest" build tag against a real
  # kube-apiserver and etcd, which setup-envtest downloads at test time. It is
  # a separate job so the "test" job is never held up by the control-plane
  # download.
  envtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run envtest suite
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: "0.21.10"
          verb: call
          module: ./ci
          args: envtest --source=.
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}

  # tests/promql is a module of its own (go 1.26, Prometheus v0.315.0), which
  # `go test ./...` at the root skips: it evaluates every input query of
  # pkg/controller/inputs in the PromQL engine of Prometheus v3.15.0 and
  # checks pkg/otel/promname against otlptranslator.
  promql:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run PromQL tests
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: "0.21.10"
          verb: call
          module: ./ci
          args: promql --source=.
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}

  # Pushes OTLP JSON to a real Prometheus with the OTLP receiver and reads it
  # back with the input queries (pkg/controller/inputs/live_test.go, build
  # tag promlive). The tests read the receiver's otlp settings from the
  # server, so each configuration runs the same command: k8s.node.name
  # promoted or not, under the default and a UTF-8 translation strategy. The
  # settings of each configuration are in ci/src/joulie_ci/literals.py.
  prometheus-otlp-live:
    name: prometheus-otlp-live (${{ matrix.config }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config: [promoted, unpromoted, utf8, utf8-unpromoted]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run live tests
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: "0.21.10"
          verb: call
          module: ./ci
          args: prometheus-otlp-live --source=. --config=${{ matrix.config }}
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}

  # The experiment sanity tests check the sweep scripts and the benchmark
  # configs, with the experiments' own requirements (pandas pulls numpy,
  # which the sweep scripts import at module level).
  experiments:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run experiment sanity tests
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: "0.21.10"
          verb: call
          module: ./ci
          args: experiments --source=.
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
