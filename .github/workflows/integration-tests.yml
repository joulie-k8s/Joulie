name: integration-tests

on:
  pull_request:
    paths:
      - "ci/**"
      - "cmd/**"
      - "pkg/**"
      - "api/**"
      - "charts/**"
      - "config/**"
      - "simulator/**"
      - "scripts/simcluster/manifests/scheduler-config.yaml"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/integration-tests.yml"
  push:
    branches: ["main"]
    paths:
      - "ci/**"
      - "cmd/**"
      - "pkg/**"
      - "api/**"
      - "charts/**"
      - "config/**"
      - "simulator/**"
      - "scripts/simcluster/manifests/scheduler-config.yaml"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/integration-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run integration tests with Dagger
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: "0.21.10"
          verb: call
          module: ./ci
          args: integration --source=.
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
