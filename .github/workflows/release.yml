name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish-images:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      # "latest" is false for a pre-release, flagged on GitHub or named like one
      # (v0.2.0-rc0), so a release candidate never moves the :latest tags below.
      - name: Set release version
        id: vars
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: bash scripts/release-version.sh "${TAG}" "${PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Login to CERN registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: registry.cern.ch
          username: ${{ secrets.CERN_REGISTRY_USER }}
          password: ${{ secrets.CERN_REGISTRY_PASSWORD }}

      # Every image is a multi-arch index of these platforms. The Dockerfiles
      # cross-compile in a builder on the runner's platform, so no QEMU.
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push agent
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          build-args: COMPONENT=agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            registry.cern.ch/joulie/joulie-agent:${{ steps.vars.outputs.version }}
            ${{ steps.vars.outputs.latest == 'true' && 'registry.cern.ch/joulie/joulie-agent:latest' || '' }}

      # The joulie-operator tags are a compatibility alias for the image that
      # was renamed to joulie-controller-manager (same build, same digest).
      # Drop the two joulie-operator lines in the minor release after the one
      # that introduced joulie-controller-manager.
      - name: Build and push controller manager
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          build-args: COMPONENT=controller-manager
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            registry.cern.ch/joulie/joulie-controller-manager:${{ steps.vars.outputs.version }}
            ${{ steps.vars.outputs.latest == 'true' && 'registry.cern.ch/joulie/joulie-controller-manager:latest' || '' }}
            registry.cern.ch/joulie/joulie-operator:${{ steps.vars.outputs.version }}
            ${{ steps.vars.outputs.latest == 'true' && 'registry.cern.ch/joulie/joulie-operator:latest' || '' }}

      - name: Build and push scheduler extender
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          build-args: COMPONENT=scheduler
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            registry.cern.ch/joulie/joulie-scheduler:${{ steps.vars.outputs.version }}
            ${{ steps.vars.outputs.latest == 'true' && 'registry.cern.ch/joulie/joulie-scheduler:latest' || '' }}

      - name: Build and push simulator
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: simulator/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            registry.cern.ch/joulie/joulie-simulator:${{ steps.vars.outputs.version }}
            ${{ steps.vars.outputs.latest == 'true' && 'registry.cern.ch/joulie/joulie-simulator:latest' || '' }}

  publish-kubectl-plugin:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set release version
        id: vars
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: bash scripts/release-version.sh "${TAG}" "${PRERELEASE}" >> "$GITHUB_OUTPUT"

      # The archive Krew installs (binary and LICENSE) and the bare binary,
      # both in dist/.
      - name: Build kubectl-joulie
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: bash scripts/kubectl-plugin-archive.sh "${TAG}" "${{ matrix.goos }}" "${{ matrix.goarch }}" dist

      - name: Login to CERN registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: registry.cern.ch
          username: ${{ secrets.CERN_REGISTRY_USER }}
          password: ${{ secrets.CERN_REGISTRY_PASSWORD }}

      - name: Push binary as OCI artifact to Harbor
        run: |
          BINARY="kubectl-joulie-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}"
          TAG="${{ steps.vars.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          curl -sLO "https://github.com/oras-project/oras/releases/download/v1.2.2/oras_1.2.2_linux_amd64.tar.gz"
          tar xzf oras_1.2.2_linux_amd64.tar.gz oras
          cd dist && ../oras push "registry.cern.ch/joulie/kubectl-joulie:${TAG}" \
            "${BINARY}:application/octet-stream"

      - name: Attach archive and binary to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "${TAG}" --clobber \
            "dist/kubectl-joulie_${TAG}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" \
            "dist/kubectl-joulie-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}"

  # Publishes the version's CHANGELOG.md section as the release notes when the
  # release was published without any, so every release carries notes. A tag
  # the changelog does not describe fails the job instead of publishing empty
  # notes.
  release-notes:
    runs-on: ubuntu-24.04
    if: ${{ github.event.release.body == '' }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Publish the CHANGELOG.md section as the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          bash scripts/changelog-section.sh "${TAG}" >notes.md
          gh release edit "${TAG}" --notes-file notes.md

  # Opens the version bump of the joulie plugin in kubernetes-sigs/krew-index
  # once every archive is attached: krew-release-bot renders
  # cmd/kubectl-joulie/krew.yaml with the tag and each archive's sha256, and
  # krew-index merges a bump of version, uri and sha256 alone without review.
  # The bot cannot submit a plugin's first version, and fails on a
  # pre-release, so the job runs for stable releases once the repository
  # variable KREW_INDEX is "true", set after the first submission merged.
  krew-index:
    runs-on: ubuntu-24.04
    needs: publish-kubectl-plugin
    if: ${{ vars.KREW_INDEX == 'true' && !github.event.release.prerelease && !contains(github.event.release.tag_name, '-') }}
    permissions:
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Open the krew-index version bump
        uses: rajatjindal/krew-release-bot@c970b8a8f6dbc2f2285a26e3ae160903b87002c3 # v0.0.51
        with:
          krew_template_file: cmd/kubectl-joulie/krew.yaml

  publish-helm-chart:
    runs-on: ubuntu-24.04
    needs: publish-images
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Set release version
        id: vars
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: bash scripts/release-version.sh "${TAG}" "${PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Login to CERN registry for Helm OCI
        run: echo "${{ secrets.CERN_REGISTRY_PASSWORD }}" | helm registry login registry.cern.ch -u "${{ secrets.CERN_REGISTRY_USER }}" --password-stdin

      - name: Package charts
        run: |
          helm package charts/joulie \
            --version "${{ steps.vars.outputs.version }}" \
            --app-version "${{ steps.vars.outputs.version }}"
          helm package charts/joulie-simulator \
            --version "${{ steps.vars.outputs.version }}" \
            --app-version "${{ steps.vars.outputs.version }}"

      - name: Push charts to CERN registry (OCI)
        run: |
          helm push "joulie-${{ steps.vars.outputs.version }}.tgz" "oci://registry.cern.ch/joulie"
          helm push "joulie-sim-${{ steps.vars.outputs.version }}.tgz" "oci://registry.cern.ch/joulie"
