name: Docs Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "website/**"
      - "ci/**"
      - ".github/workflows/docs-preview.yml"
      - ".github/workflows/docs-main.yml"
      - ".github/workflows/docs-release.yml"
      - "README.md"

permissions:
  contents: write
  pull-requests: write

# One group per PR: a newer push to the same PR cancels the older preview build,
# and previews can no longer evict main or release deploys from a shared queue.
concurrency:
  group: gh-pages-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    env:
      PREVIEW_DIR: previews/pr-${{ github.event.pull_request.number }}
      PREVIEW_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/previews/pr-${{ github.event.pull_request.number }}/
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate Docsy versions config
        env:
          ROOT_PATH: /${{ github.event.repository.name }}
          OUT_FILE: ${{ runner.temp }}/docsy-versions.yaml
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          MANIFEST="${RUNNER_TEMP}/versions.json"
          rm -f "$MANIFEST"
          git clone --depth 1 --branch gh-pages "https://github.com/${GH_REPO}.git" "${RUNNER_TEMP}/gh-pages" >/dev/null 2>&1 || true
          if [ -f "${RUNNER_TEMP}/gh-pages/versions.json" ]; then
            cp "${RUNNER_TEMP}/gh-pages/versions.json" "$MANIFEST"
          fi
          python3 - <<'PY'
          import json, os, pathlib

          root = os.environ["ROOT_PATH"]
          out = pathlib.Path(os.environ["OUT_FILE"])
          manifest = pathlib.Path(os.environ["RUNNER_TEMP"]) / "versions.json"

          entries = []
          if manifest.exists():
              try:
                  data = json.loads(manifest.read_text())
                  for e in data.get("versions", []):
                      n = str(e.get("name", "")).strip()
                      p = str(e.get("path", "")).strip()
                      if n and p:
                          entries.append((n, p))
              except Exception:
                  pass

          extras = [(n, p) for (n, p) in entries if n not in {"stable", "main"}]
          final = [("stable", f"{root}/stable/"), ("main", f"{root}/main/")] + extras

          dedup = []
          seen = set()
          for n, p in final:
              if n in seen:
                  continue
              seen.add(n)
              dedup.append((n, p))

          lines = ["params:", "  version_menu: \"Version\"", "  versions:"]
          for n, p in dedup:
              lines.append(f"    - version: {json.dumps(n)}")
              lines.append(f"      url: {json.dumps(p)}")
          out.write_text("\n".join(lines) + "\n")
          print(out)
          PY

      # The docs function of the Dagger module in ci/ builds the site with
      # Hugo, Docsy and PostCSS as `dagger -m ./ci call docs` does anywhere,
      # and exports it to website/public for the deploy.
      - name: Build preview site
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: "0.21.10"
          verb: call
          module: ./ci
          args: docs --source=. --base-url=${{ env.PREVIEW_URL }} --versions-config=${{ runner.temp }}/docsy-versions.yaml export --path=website/public
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      # Every docs workflow pushes gh-pages, in concurrency groups of their
      # own, so a push can lose the race to another one: gh-pages-push.sh
      # rebases onto it and pushes again.
      - name: Deploy preview to gh-pages
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESSAGE: "docs: preview for PR #${{ github.event.pull_request.number }} at ${{ github.event.pull_request.head.sha }}"
        run: bash scripts/gh-pages-push.sh publish website/public "$PREVIEW_DIR" "$MESSAGE"

      # The marker finds this workflow's earlier comment, so every push
      # updates that one comment instead of adding another.
      - name: Find the preview comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        id: preview-comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "<!-- docs-preview-comment -->"

      - name: Comment preview URL
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.preview-comment.outputs.comment-id }}
          body: |
            <!-- docs-preview-comment -->
            Docs preview is ready:
            ${{ env.PREVIEW_URL }}
          edit-mode: replace

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-24.04
    env:
      PREVIEW_DIR: previews/pr-${{ github.event.pull_request.number }}
    steps:
      # The default branch, for scripts/gh-pages-push.sh.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Remove preview directory
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESSAGE: "docs: remove preview for PR #${{ github.event.pull_request.number }}"
        run: bash scripts/gh-pages-push.sh remove "$PREVIEW_DIR" "$MESSAGE"
