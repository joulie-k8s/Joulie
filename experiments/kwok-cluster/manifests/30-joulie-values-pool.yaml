agent:
  mode: pool
  hostNetwork: false
  privileged: false
  env:
    RECONCILE_INTERVAL: "8s"
    METRICS_ADDR: ":8080"
    SIMULATE_ONLY: "false"
    # Read telemetry from the simulator and send CPU and GPU controls to it over HTTP.
    TELEMETRY_CPU_SOURCE: http
    TELEMETRY_CPU_HTTP_ENDPOINT: "http://joulie-telemetry-sim.joulie-sim-demo.svc.cluster.local/otlp/telemetry/{node}"
    TELEMETRY_CPU_CONTROL: http
    TELEMETRY_CPU_CONTROL_HTTP_ENDPOINT: "http://joulie-telemetry-sim.joulie-sim-demo.svc.cluster.local/control/{node}"
    TELEMETRY_CPU_CONTROL_MODE: dvfs
    TELEMETRY_GPU_CONTROL: http
    TELEMETRY_GPU_CONTROL_HTTP_ENDPOINT: "http://joulie-telemetry-sim.joulie-sim-demo.svc.cluster.local/control/{node}"
  pool:
    replicas: 2
    shards: 2
    nodeSelector: "joulie.io/managed=true"

controllerManager:
  env:
    RECONCILE_INTERVAL: "20s"
    NODE_SELECTOR: "joulie.io/managed=true"
    ECO_CAP_WATTS: "120"
    PERFORMANCE_CAP_WATTS: "500"
    GPU_PERFORMANCE_CAP_PCT_OF_MAX: "100"
    GPU_ECO_CAP_PCT_OF_MAX: "60"
    GPU_WRITE_ABSOLUTE_CAPS: "true"
    GPU_MODEL_CAPS_JSON: '{"NVIDIA-L40S":{"minCapWatts":200,"maxCapWatts":350},"AMD-Radeon-PRO-W7900":{"minCapWatts":200,"maxCapWatts":295}}'
    # This example installs no Prometheus: read node power from the simulator.
    NODE_POWER_SOURCE: http
    NODE_POWER_HTTP_ENDPOINT: "http://joulie-telemetry-sim.joulie-sim-demo.svc.cluster.local/otlp/telemetry/{node}"
