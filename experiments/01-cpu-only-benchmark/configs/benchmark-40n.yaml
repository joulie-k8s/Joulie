run:
  baselines: [A, B, C]
  seeds: 2
  # 40 CPU nodes.  time_scale 120.
  # The simulator has no time scale: a job advances base_speed_per_core work
  # units per core (or GPU) per wall second. time_scale only maps the trace's
  # wall-clock offsets onto the simulated day: 1 wall second is 120 simulated
  # seconds, so the facility period of 720 s is one simulated day. A run
  # starts at regime (workload.prefill_sec: the trace is read as if it had
  # run for 1500 s already), lasts the arrival window (timeout =
  # workload.arrival_window_sec, 900 s, 30 simulated hours) and is stopped
  # there, before the drain; the report measures from measure_from_sec
  # (120 s, once the prefilled pods run) to the end. repeat_first_run runs
  # the first run again at the end, to measure run-to-run noise.
  jobs: 6000
  mean_inter_arrival_sec: 0.1
  time_scale: 120
  timeout: 900
  measure_from_sec: 120
  repeat_first_run: true
  settle_seconds: 10
  cleanup_timeout: 300

workload:
  perf_ratio: 0.20
  compute_bound_perf_boost: 3.5
  gpu_ratio: 0.00
  burst_day_probability: 0.50
  burst_mean_jobs: 25.0
  burst_multiplier: 3.5
  dip_day_probability: 0.40
  dip_multiplier: 0.08
  emit_workload_records: true
  # work_scale sizes the load: at regime the requested CPU cores x time are
  # 0.74 and 0.71 of the cluster's 8,320 CPU cores, and their utilization 0.58 and 0.55
  # (seeds 1 and 2, no queueing; experiments/README.md, "Sizing the load").
  work_scale: 0.2627
  arrival_window_sec: 900
  prefill_sec: 1500
  diurnal_peak_rate: 20
  baseline_a_strip_affinity: true
  allowed_workload_types:
    - cpu_preprocess
    - cpu_analytics

simulator:
  base_speed_per_core: 2.0
  manifest: experiments/kwok-cluster/manifests/20-simulator.yaml
  facility_ambient_base_c: 22.0
  facility_ambient_amplitude_c: 8.0
  facility_ambient_period_sec: 720

policy:
  # Percent CPU caps: the agent resolves them into watts within each node's
  # catalog cap range, sockets x 0.55 x TDP to sockets x TDP (a package power
  # limit may be set below the cTDP range); a cap the CPU cannot reach holds
  # it at its lowest-frequency power (no vendor publishes a minimum for these
  # CPUs, so the simulator sets no floor).
  cpu_write_absolute_caps: false
  caps:
    # A GPU node's CPU always gets performance_watts as an absolute cap
    # (controller manager, GPU nodes): 5000 W, the chart default, never binds.
    performance_watts: 5000
    cpu_performance_pct_of_max: 100
    cpu_eco_pct_of_max: 60
  loop:
    operator_reconcile_interval: "20s"
    agent_reconcile_interval: "10s"
    queue_aware_operator_reconcile_sim_seconds: 300
  # Sized on seeds 3 and 4, which the sweep does not measure, by
  # experiments/kwok-cluster/pool_load.py: performance jobs run only on
  # performance nodes under B and C, and PerformanceSet splits those over
  # hardware families in proportion to their nodes. B holds the performance
  # demand of every pool at its peak (19 of 40 nodes). C starts from the
  # fewest nodes the demand needs (15) and adds a node per 6 performance
  # pods, running or pending (6.3 per needed node on average), up to every
  # node.
  static:
    hp_frac: 0.48
  queue_aware:
    hp_base_frac: 0.375
    hp_min: 1
    hp_max: 40
    perf_per_hp_node: 6

images:
  # Built from this tree and loaded into the kind cluster (no registry pull).
  joulie_registry: joulie.local
  joulie_tag: rerun-2026-10-28
  sim_registry: joulie.local
  sim_image: joulie-simulator
  sim_tag: rerun-2026-10-28

inventory:
  source: experiments/01-cpu-only-benchmark/configs/cluster-nodes.yaml

install:
  kind_cluster_config: experiments/01-cpu-only-benchmark/configs/kind-cluster.yaml
