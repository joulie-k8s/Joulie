# Q5 of experiment 05: which conclusions survive the assumed parameters.
# Each assumed fact of the governor and GPU clock models runs at a low, mid
# and high value, one fact at a time, on Tier A's own cells (tier-a.yaml)
# for the arms the defaults choose between, so the acceptance and its Q5
# check judge the same cells; the base cells, without a variant, are Tier
# A's. CPU facts vary the CPU cells only, GPU facts the GPU cells only. One
# seed: in Tier A the two seeds give the same energy in every steady and GPU
# job cell. The receiver gate, which every repository profile leaves off,
# runs in tier-a-gate.yaml (Q3).
#
# freqRampMS is how long the CPU frequency takes to follow the governor
# (every profile assumes 500 ms, the simulator default). The kernel's
# schedutil recomputes at most every rate_limit_us, by default 1.5 times the
# driver's transition latency or 1 ms, and ondemand samples about every 2 ms
# (docs.kernel.org/admin-guide/pm/cpufreq.html); the load signal a governor
# follows adds its own delay, which hwemu does not model. 5 to 500 ms
# brackets both.
name: tier-a-sensitivity
seeds: [1]
durationS: 60
settleS: 10
stepS: 2
substepMS: 100
limitFactor: 10
cpu:
  profiles:
  - amd-epyc-9534-2s-energy-only
  - intel-xeon-6530-2s-rapl
  - intel-xeon-2s-rapl
  - amd-epyc-2s-hsmp
  - intel-xeon6-2s-tpmi
  arms:
  - {preset: performance, boost: "on"}
  - {preset: balanced, boost: "on"}
  - {preset: efficiency, boost: "on"}
  - {preset: efficiency, boost: "off"}
  idle: true
  steadyPct: [10, 30, 50, 70, 100]
  classes:
    cpu.compute_bound: {memoryIntensity: 0.2, ioIntensity: 0.05}
    cpu.memory_bound:  {memoryIntensity: 0.85, ioIntensity: 0.1}
    cpu.mixed:         {memoryIntensity: 0.5, ioIntensity: 0.15}
    cpu.io_bound:      {memoryIntensity: 0.3, ioIntensity: 0.85}
  bursty: {classes: [cpu.io_bound, cpu.compute_bound], burstMS: 50, periodMS: 1000, jitterMS: 100, bursts: 30, substepMS: 1}
gpu:
  profiles:
  - amd-radeon-pro-w7900-4gpu
  - amd-instinct-mi300x-8gpu
  - nvidia-h100-sxm-8gpu
  - nvidia-h100-nvl-8gpu
  - nvidia-l40s-4gpu
  arms:
  - {preset: auto}
  - {preset: sustained}
  - {preset: efficient, ceilingPct: [75, 80, 90]}
  capsPct: [100]
  receiverGates: [profile]
  classes:
    gpu.compute_bound:   {memoryIntensity: 0.2}
    gpu.memory_bound:    {memoryIntensity: 0.85}
    gpu.bandwidth_bound: {memoryIntensity: 0.95}
  jobs:
  - {gpus: 1}
  - {gpus: 2, peer: [0.1, 0.3, 0.6], nic: [0.1, 0.3, 0.6]}
  - {gpus: 4, peer: [0.1, 0.3, 0.6], nic: [0.1, 0.3, 0.6], gather: [0.1, 0.3, 0.6]}
  idle: true
  cpuUtil: 0.05
sensitivity:
- {fact: idleGovernorDeltaPctOfIdle, values: [0, 2, 5]}
- {fact: eppGain, values: [0.5, 1, 2]}
- {fact: eppCeilingDrop, values: [0, 0.2, 0.25]}
- {fact: freqRampMS, values: [5, 50, 500]}
- {fact: dataPathHoldW, values: [1, 10, 50]}
- {fact: gatingOffIdleW, values: [5, 20, 50]}
- {fact: clockBeta, values: [1.0, 1.5, 2.5]}
- {fact: memoryKneeFrac, values: [0.4, 0.65, 0.87]}
- {fact: autoHoldS, values: [2, 10, 60]}
