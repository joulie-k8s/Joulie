# Q3 of experiment 05: with a receiver gate, how much a gather job (four
# GPUs sending into an idle one) gains from sustained, and what the gate
# costs under auto. Every repository profile leaves the gate off with
# neutral fractions (slowFraction 1.0), so the main grid shows no gate
# effect; here the gate runs forced on against the profile's own (off),
# with slowFraction at 0.5 and 0.7. The H100 NVL and SXM are left out: their
# HBM runs at its one rated clock (mem.minMHz equals mem.maxMHz), so the gate
# cannot act on them.
name: tier-a-gate
seeds: [1]
durationS: 60
settleS: 10
stepS: 2
substepMS: 100
limitFactor: 10
gpu:
  profiles:
  - amd-radeon-pro-w7900-4gpu
  - amd-instinct-mi300x-8gpu
  - nvidia-l40s-4gpu
  arms:
  - {preset: auto}
  - {preset: sustained}
  capsPct: [100]
  receiverGates: [profile, "on"]
  classes:
    gpu.compute_bound: {memoryIntensity: 0.2}
    gpu.memory_bound:  {memoryIntensity: 0.85}
  jobs:
  - {gpus: 4, gather: [0.3]}
  idle: true
  cpuUtil: 0.05
sensitivity:
- {fact: slowFraction, values: [0.5, 0.7]}
