---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: nodetwins.joulie.io
spec:
  group: joulie.io
  names:
    kind: NodeTwin
    listKind: NodeTwinList
    plural: nodetwins
    shortNames:
    - nt
    singular: nodetwin
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.nodeName
      name: Node
      type: string
    - jsonPath: .spec.profile
      name: Profile
      type: string
    - jsonPath: .status.schedulableClass
      name: Class
      type: string
    - jsonPath: .status.predictedPowerHeadroomScore
      name: PowerHeadroom
      type: number
    - jsonPath: .status.predictedCoolingStressScore
      name: CoolingStress
      type: number
    - jsonPath: .status.predictedPsuStressScore
      name: PSUStress
      type: number
    - jsonPath: .spec.cpu.packagePowerCapPctOfMax
      name: CPU-Cap
      type: string
    - jsonPath: .spec.scheduling.draining
      name: Draining
      type: boolean
    - jsonPath: .spec.cpu.governor.preset
      name: CPU-Gov
      type: string
    - jsonPath: .spec.gpu.governor.preset
      name: GPU-Gov
      type: string
    - jsonPath: .status.conditions[?(@.type=="AgentReporting")].status
      name: Agent
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          NodeTwin combines a node's desired power state and its computed twin
          output. spec is written by the controller manager, status by its twin
          model plus the agent's control feedback.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Desired power state for this node, written by the controller
              manager.
            properties:
              cpu:
                description: |-
                  NodeTwinCPU is the CPU package power cap, as an absolute value or as a
                  fraction of the hardware maximum, and the CPU frequency governor. At most
                  one cap is set.
                properties:
                  governor:
                    description: |-
                      Governor is the CPU frequency governor preset for every cpufreq policy
                      of the node. Absent means the agent leaves the governor as it is.
                    properties:
                      boost:
                        description: Boost turns frequency boost (turbo) on or off.
                          Absent leaves it as it is.
                        enum:
                        - "on"
                        - "off"
                        type: string
                      preset:
                        description: |-
                          Preset is performance (highest frequency at any load), balanced
                          (demand-driven, quick ramp) or efficiency (demand-driven with an energy
                          bias).
                        enum:
                        - performance
                        - balanced
                        - efficiency
                        type: string
                    required:
                    - preset
                    type: object
                  packagePowerCapPctOfMax:
                    exclusiveMinimum: true
                    maximum: 100
                    minimum: 0
                    type: number
                  packagePowerCapWatts:
                    minimum: 1
                    type: number
                type: object
              gpu:
                description: NodeTwinGPU holds the GPU power controls and the GPU
                  clock governor.
                properties:
                  governor:
                    description: |-
                      Governor is the GPU clock governor preset for every GPU of the node.
                      Absent means the agent leaves the GPU clocks as they are.
                    properties:
                      computeClockCeilingPctOfMax:
                        description: |-
                          ComputeClockCeilingPctOfMax is the compute clock ceiling of the
                          efficient preset, as a percentage of the GPU's maximum compute clock.
                          Only meaningful with efficient.
                        exclusiveMinimum: true
                        maximum: 100
                        minimum: 0
                        type: number
                      preset:
                        description: |-
                          Preset is auto (the vendor default), sustained (data-path clocks held
                          at their maximum, idle gating kept), efficient (compute clock under a
                          ceiling), low (every clock at its minimum) or peak (every clock at its
                          maximum, idle gating off).
                        enum:
                        - auto
                        - sustained
                        - efficient
                        - low
                        - peak
                        type: string
                    required:
                    - preset
                    type: object
                  powerCap:
                    description: |-
                      GPUPowerCap is the GPU power cap, as an absolute value per GPU or as a
                      fraction of the hardware maximum.
                    properties:
                      capPctOfMax:
                        exclusiveMinimum: true
                        maximum: 100
                        minimum: 0
                        type: number
                      capWattsPerGpu:
                        minimum: 1
                        type: number
                      scope:
                        enum:
                        - perGpu
                        type: string
                    type: object
                type: object
              nodeName:
                type: string
              policy:
                description: NodeTwinPolicy names the policy that produced this spec.
                properties:
                  name:
                    type: string
                type: object
              profile:
                enum:
                - performance
                - eco
                type: string
              scheduling:
                description: NodeTwinScheduling carries scheduling hints derived from
                  the policy.
                properties:
                  draining:
                    type: boolean
                type: object
            required:
            - nodeName
            - profile
            type: object
          status:
            description: Computed twin state, written by the controller manager's
              digital twin model.
            properties:
              conditions:
                description: |-
                  Conditions are the controller manager's observations of the node.
                  AgentReporting is True while an agent publishes the node's
                  NodeHardware, and False when none has published it (reason
                  NoNodeHardware) or its last write is older than 15 minutes (reason
                  NodeHardwareStale): the caps in spec are then planned, not enforced.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              controlStatus:
                description: Control feedback from the agent
                properties:
                  cpu:
                    description: ControlResult is the outcome of the last control
                      write for one component.
                    properties:
                      applied:
                        description: |-
                          Applied is the native setting in effect, in the driver's own words,
                          such as schedutil or high. Set by the governor results only.
                        type: string
                      backend:
                        type: string
                      message:
                        type: string
                      result:
                        type: string
                      updatedAt:
                        description: UpdatedAt is the RFC3339 time of the last agent
                          write.
                        type: string
                    type: object
                  cpuGovernor:
                    description: CPUGovernor is the outcome of the last CPU governor
                      write.
                    properties:
                      applied:
                        description: |-
                          Applied is the native setting in effect, in the driver's own words,
                          such as schedutil or high. Set by the governor results only.
                        type: string
                      backend:
                        type: string
                      message:
                        type: string
                      result:
                        type: string
                      updatedAt:
                        description: UpdatedAt is the RFC3339 time of the last agent
                          write.
                        type: string
                    type: object
                  gpu:
                    description: ControlResult is the outcome of the last control
                      write for one component.
                    properties:
                      applied:
                        description: |-
                          Applied is the native setting in effect, in the driver's own words,
                          such as schedutil or high. Set by the governor results only.
                        type: string
                      backend:
                        type: string
                      message:
                        type: string
                      result:
                        type: string
                      updatedAt:
                        description: UpdatedAt is the RFC3339 time of the last agent
                          write.
                        type: string
                    type: object
                  gpuGovernor:
                    description: GPUGovernor is the outcome of the last GPU governor
                      write.
                    properties:
                      applied:
                        description: |-
                          Applied is the native setting in effect, in the driver's own words,
                          such as schedutil or high. Set by the governor results only.
                        type: string
                      backend:
                        type: string
                      message:
                        type: string
                      result:
                        type: string
                      updatedAt:
                        description: UpdatedAt is the RFC3339 time of the last agent
                          write.
                        type: string
                    type: object
                type: object
              effectiveCapState:
                description: |-
                  CapState is the cap the controller manager believes is in effect, as a percentage
                  of the hardware maximum.
                properties:
                  cpuPct:
                    type: number
                  gpuPct:
                    type: number
                type: object
              estimatedPUE:
                description: Reserved for future rack-topology-aware extensions. Not
                  used in scoring. Estimated Power Usage Effectiveness (1.05-1.40)
                type: number
              lastUpdated:
                description: LastUpdated is the RFC3339 time of the last controller
                  manager write.
                type: string
              powerMeasurement:
                description: Measured power data, TDP/cap breakdowns, and power trend.
                properties:
                  cpuCappedPowerW:
                    description: CPU power budget based on TDP and cap percentage
                    type: number
                  cpuTdpW:
                    description: CPU thermal design power (uncapped hardware maximum)
                    type: number
                  gpuCappedPowerW:
                    description: GPU power budget based on TDP and cap percentage
                    type: number
                  gpuTdpW:
                    description: GPU thermal design power (uncapped hardware maximum)
                    type: number
                  measuredNodePowerW:
                    description: |-
                      Measured node power draw in watts: the CPU packages plus the GPUs, or
                      the whole host with NODE_POWER_SCOPE=host
                    type: number
                  nodeCappedPowerW:
                    description: Total node power budget (cpuCappedPowerW + gpuCappedPowerW)
                    type: number
                  nodeTdpW:
                    description: Total node TDP (cpuTdpW + gpuTdpW)
                    type: number
                  powerTrendWPerMin:
                    description: Rate of change of measured power in watts per minute
                    type: number
                  source:
                    description: |-
                      Where measuredNodePowerW came from: prometheus, prometheus-no-data,
                      http, http-error, http-no-endpoint or static; kepler and utilization
                      are reserved.
                    enum:
                    - kepler
                    - utilization
                    - static
                    - http
                    - http-error
                    - http-no-endpoint
                    - prometheus
                    - prometheus-no-data
                    type: string
                type: object
              predictedCoolingStressScore:
                description: 0=no stress, 100=max stress
                type: number
              predictedPowerHeadroomScore:
                description: 0=no headroom, 100=full headroom
                type: number
              predictedPsuStressScore:
                description: Reserved for future rack-topology-aware extensions. Not
                  used in scoring. 0=no stress, 100=max stress
                type: number
              schedulableClass:
                enum:
                - eco
                - performance
                - draining
                - unknown
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
