{{- /*
One agent Deployment per emulated node of a simulated cluster. Each manages
the node agent.emulated.nodes names through that node's hwemu tree, with the
pod spec the DaemonSet runs on a real node (joulie.agentPodSpec). Recreate:
two agents must never write one tree.
*/}}
{{- if eq .Values.agent.mode "emulated" }}
{{- $names := dict }}
{{- range $i, $node := .Values.agent.emulated.nodes }}
{{- with $node.name }}
{{- if hasKey $names (toString .) }}
{{- fail (printf "agent.emulated.nodes: %q is listed twice; two agents must never write one tree" .) }}
{{- end }}
{{- $_ := set $names (toString .) true }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: joulie-agent-emu-{{ $i }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: joulie-agent
    app.kubernetes.io/component: emulated
    sim.joulie.io/agent-index: {{ $i | quote }}
  annotations:
    sim.joulie.io/node: {{ $node.name | quote }}
    sim.joulie.io/profile: {{ required "every agent.emulated.nodes entry needs a profile" $node.profile | quote }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: joulie-agent
      app.kubernetes.io/component: emulated
      sim.joulie.io/agent-index: {{ $i | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: joulie-agent
        app.kubernetes.io/component: emulated
        sim.joulie.io/agent-index: {{ $i | quote }}
      annotations:
        sim.joulie.io/node: {{ $node.name | quote }}
        sim.joulie.io/profile: {{ $node.profile | quote }}
    spec:
      {{- include "joulie.agentPodSpec" (dict "root" $ "mode" "emulated" "node" $node) | nindent 6 }}
{{- end }}
{{- end }}
