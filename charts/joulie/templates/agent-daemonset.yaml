{{- if eq .Values.agent.mode "daemonset" }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: joulie-agent
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: joulie-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: joulie-agent
    spec:
      {{- include "joulie.agentPodSpec" (dict "root" $ "mode" "daemonset") | nindent 6 }}
{{- end }}
