{{- $cm := include "joulie.controllerManager" . | fromYaml }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: joulie-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    control-plane: controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: joulie-controller-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: joulie-controller-manager
        control-plane: controller-manager
    spec:
      serviceAccountName: joulie-controller-manager
      {{- with $cm.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: controller-manager
          image: "{{ $cm.image.repository }}:{{ $cm.image.tag }}"
          imagePullPolicy: {{ $cm.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: {{ $cm.service.port }}
              protocol: TCP
          env:
            - name: LEADER_ELECT
              value: {{ $cm.leaderElection.enabled | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- range $k, $v := $cm.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- if .Values.hardwareCatalog.enabled }}
            - name: HARDWARE_CATALOG_PATH
              value: "{{ .Values.hardwareCatalog.mountPath }}/{{ .Values.hardwareCatalog.key }}"
            {{- end }}
          {{- if .Values.hardwareCatalog.enabled }}
          volumeMounts:
            - name: hardware-catalog
              mountPath: {{ .Values.hardwareCatalog.mountPath }}
              readOnly: true
          {{- end }}
      {{- if .Values.hardwareCatalog.enabled }}
      volumes:
        - name: hardware-catalog
          configMap:
            name: {{ .Values.hardwareCatalog.configMapName }}
      {{- end }}
