nameOverride: ""
fullnameOverride: ""

agent:
  # daemonset: one agent per node with joulie.io/managed=true (the default).
  # pool: a few agents that shard the managed nodes between them.
  # emulated: one Deployment per agent.emulated.nodes entry, each managing an
  #   emulated node of the simulated cluster through its hwemu tree.
  # none: no agent.
  mode: daemonset          # daemonset | pool | emulated | none
  image:
    repository: registry.cern.ch/joulie/joulie-agent
    # Empty pulls the chart's appVersion: the release's own version for a chart
    # from the registry, latest for a chart from a checkout.
    tag: ""
    pullPolicy: IfNotPresent
  hostNetwork: true
  privileged: true
  env:
    RECONCILE_INTERVAL: "20s"
    METRICS_ADDR: ":8080"
    SIMULATE_ONLY: "false"
  daemonset:
    nodeSelector:
      joulie.io/managed: "true"
  # Taints the DaemonSet and emulated agents tolerate. The default covers the
  # NoSchedule taint GPU nodes usually carry, so the agent also runs on them
  # and enforces the caps planned there. A node whose taints the agent does
  # not tolerate gets planned caps that nothing enforces.
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: amd.com/gpu
      operator: Exists
      effect: NoSchedule
  # Hooks into the DaemonSet and emulated agent pods, for example to reach
  # the GPU tools of a node through a runtime class or a hostPath mount (the
  # agent image ships none). Each renders only when set.
  extraEnv: []            # EnvVar list, after the chart's env
  extraVolumes: []        # Volume list, after the chart's volumes
  extraVolumeMounts: []   # VolumeMount list, after the chart's mounts
  runtimeClassName: ""
  # agent.mode emulated only. Every pod runs on the node holding the hwemu
  # trees and mounts its node's tree under root: sys at /host-sys, cpuinfo
  # over /proc/cpuinfo, state at /emu/state, the GPU tool links at /emu/bin,
  # root/lib at /emu/lib. nodes is written by "simcluster agents" (entries:
  # name, profile, devNvidiactl, extraVolumes, extraVolumeMounts). These pods
  # ignore hostNetwork and privileged above: they get neither.
  emulated:
    root: /var/lib/joulie-hwemu
    hostNodeSelector:
      joulie.io/hwemu-host: "true"
    path: /emu/bin:/usr/local/bin:/usr/bin:/bin
    nodes: []
  pool:
    replicas: 2
    nodeSelector: "joulie.io/managed=true"
    podNodeSelector: {}
    shards: 2
  service:
    enabled: true
    port: 8080
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8080"
      prometheus.io/path: /metrics

# Cluster-scoped controller manager (Deployment joulie-controller-manager).
# Upgrading from a chart that still shipped "joulie-operator": the Deployment,
# ServiceAccount and RBAC objects are renamed, so helm upgrade creates the new
# ones and deletes the old; expect one restart of the control loop.
controllerManager:
  nodeSelector: {}
  image:
    repository: registry.cern.ch/joulie/joulie-controller-manager
    # Empty pulls the chart's appVersion: the release's own version for a chart
    # from the registry, latest for a chart from a checkout.
    tag: ""
    pullPolicy: IfNotPresent
  leaderElection:
    enabled: false  # only the leader reconciles; needed before running more than one replica
  env:
    RECONCILE_INTERVAL: "1m"
    METRICS_ADDR: ":8081"
    NODE_SELECTOR: "joulie.io/managed=true"
    RESERVED_LABEL_KEY: "joulie.io/reserved"
    POWER_PROFILE_LABEL: "joulie.io/power-profile"
    PERFORMANCE_CAP_WATTS: "5000"
    ECO_CAP_WATTS: "120"
    CPU_PERFORMANCE_CAP_PCT_OF_MAX: "100"
    CPU_ECO_CAP_PCT_OF_MAX: "60"
    CPU_WRITE_ABSOLUTE_CAPS: "false"
    GPU_PERFORMANCE_CAP_PCT_OF_MAX: "100"
    GPU_ECO_CAP_PCT_OF_MAX: "60"
    GPU_WRITE_ABSOLUTE_CAPS: "false"
    GPU_MODEL_CAPS_JSON: "{}"
    GPU_PRODUCT_LABEL_KEYS: "joulie.io/gpu.product,nvidia.com/gpu.product,amd.com/gpu.product,amd.com/gpu.family"
    # Measured power and facility metrics come from this Prometheus: producers
    # push hw.* over OTLP (--web.enable-otlp-receiver), and promoting k8s.node.name
    # (otlp.promote_resource_attributes) avoids a target_info join. See values/prometheus-grafana.yaml.
    PROMETHEUS_ADDRESS: "http://prometheus-operated.monitoring:9090"
    NODE_POWER_SOURCE: "prometheus"
    NODE_POWER_SCOPE: "components"
    PROMETHEUS_RATE_WINDOW: "5m"
    ENABLE_FACILITY_METRICS: "false"
    FACILITY_PRESET: "otel"
    FACILITY_POLL_INTERVAL: "30s"
  service:
    enabled: true
    port: 8081
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8081"
      prometheus.io/path: /metrics

# Deprecated: old name of the controllerManager section, removed in the next
# minor release. Keys set here are merged over controllerManager for now.
operator: {}

schedulerExtender:
  enabled: false  # disabled by default; enable when using custom kube-scheduler config
  image:
    repository: registry.cern.ch/joulie/joulie-scheduler
    # Empty pulls the chart's appVersion: the release's own version for a chart
    # from the registry, latest for a chart from a checkout.
    tag: ""
  port: 9876
  clusterIP: ""  # set a fixed ClusterIP so the scheduler config can use an IP instead of DNS
  replicas: 1
  # true runs the extender on its node's network, for a kube-scheduler that
  # calls it on 127.0.0.1. Its port then cannot be held by two pods on one
  # node, so the Deployment switches to strategy Recreate: the old pod stops
  # before the new one starts. Scheduling goes on during that gap only while
  # the scheduler config marks the extender ignorable: true; with
  # ignorable: false, set nodeName as well.
  hostNetwork: false
  nodeName: ""  # set to bypass scheduler (needed when ignorable=false)
  nodeSelector: {}
  env: {}

hardwareCatalog:
  enabled: false  # mount hardware catalog ConfigMap into controller manager and agent
  configMapName: joulie-hardware-catalog
  key: hardware.yaml
  mountPath: /etc/joulie-catalog

grafanaDashboard:
  enabled: false  # enable if Grafana sidecar is configured to auto-provision dashboards
  labels:
    grafana_dashboard: "1"
