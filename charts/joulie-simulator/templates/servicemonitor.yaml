{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "joulie-simulator.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "joulie-simulator.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "joulie-simulator.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
    {{- /* honorLabels false: an exporter's own instance label, such as Kepler
    0.7's node name, is kept as exported_instance, as with the real exporter. */}}
    {{- if .Values.emulate.enabled }}
    {{- range .Values.emulate.exporters }}
    - port: http
      path: /exporters/{{ . }}/metrics
      interval: {{ $.Values.serviceMonitor.interval }}
      honorLabels: false
    {{- end }}
    {{- end }}
{{- end }}
