# Two socket Cascade Lake-AP host: two dies per package, and RAPL counts
# and limits each die on its own (raplmultidie; raplcommon#1720-1724). The
# kernel names a die's zone package-X-die-Y (raplcommon#1788-1792), so each
# package has two zones, each with its own counter, PL1 and DRAM child.
schemaVersion: 1
name: intel-xeon-2s-multidie
description: Two socket Xeon Platinum 9282 (Cascade Lake-AP, two dies per package), intel_pstate, one RAPL zone per die named package-X-die-Y with per-die PL1/PL2 and disabled write-rejecting DRAM sub-zones.
sources:
  ark9282:      {kind: published, ref: "https://www.intel.com/content/www/us/en/products/sku/194146/intel-xeon-platinum-9282-processor-77m-cache-2-60-ghz/specifications.html", note: "56 cores, 112 threads, base 2.60 GHz, max turbo 3.80 GHz, TDP 400 W, 12 memory channels, scalability 2, Cascade Lake"}
  corpus8260:   {kind: corpus, ref: cmd/agent/testdata/hardware/xeon-4socket-nfd-labels, note: "Cascade Lake Platinum 8260: model 85, brand string format, RAPL units and limits"}
  intelfamily:  {kind: published, ref: "linux v7.3-rc5 arch/x86/include/asm/intel-family.h:95", note: "INTEL_SKYLAKE_X IFM(6, 0x55)"}
  raplmsr:      {kind: published, ref: "linux v7.3-rc5 drivers/powercap/intel_rapl_msr.c:349-354,432", note: "SKYLAKE_X uses rapl_defaults_hsw_server: dram_domain_energy_unit = 15300"}
  raplcommon:   {kind: published, ref: "linux v7.3-rc5 drivers/powercap/intel_rapl_common.c:33,50,105-151,215,479-486,741,978-983,1720-1724,1788-1792", note: "CLX-AP has per-die package energy counters; package-%d-die-%d when the package has more than one die"}
  raplmultidie: {kind: published, ref: "https://github.com/torvalds/linux/commit/32fb480e0a2c", note: "RAPL package domains are implemented in hardware per die"}
  pstate:       {kind: published, ref: "linux v7.3-rc5 Documentation/admin-guide/pm/intel_pstate.rst:39-41,90-91", note: "one policy per logical CPU; active mode offers powersave and performance"}
  nfd:          {kind: published, ref: "https://kubernetes-sigs.github.io/node-feature-discovery/stable/reference/worker-configuration-reference.html", note: "deviceClassWhitelist [03, 0b40, 12]; deviceLabelFields [class, vendor]"}
  pstate612:   {kind: published, ref: "linux v6.12 drivers/cpufreq/intel_pstate.c:42-44,694-701,790-797,808-819,1420-1430,1511-1560,1810-1822,3248-3263", note: "status prints the mode; no_turbo in both modes; the EPP pair with HWP, every preference listed, a non-zero EPP refused under performance in active mode; transition delay 5000 us with HWP and 500 us without in passive mode"}
node:
  nfd: present
  labels:
    cpu:
      src: "assumed:NFD cpu labels for this cpu block (family 6, model 85) with intel_pstate active"
      values:
        feature.node.kubernetes.io/cpu-model.vendor_id: Intel
        feature.node.kubernetes.io/cpu-model.family: "6"
        feature.node.kubernetes.io/cpu-model.id: "85"
        feature.node.kubernetes.io/cpu-model.hypervisor: none
        feature.node.kubernetes.io/cpu-hardware_multithreading: "true"
        feature.node.kubernetes.io/cpu-pstate.status: active
        feature.node.kubernetes.io/cpu-pstate.scaling_governor: powersave
        feature.node.kubernetes.io/cpu-pstate.turbo: "true"
        kubernetes.io/arch: amd64
        kubernetes.io/os: linux
  taints: []
  capacity:
    cpu: {v: 224, src: "derived:ark9282#2 sockets x 56 cores x 2 threads"}
    memoryKi: {v: 790000000, src: "assumed:a 768 GiB node, 24 x 32 GiB DDR4 over the 12 channels of each package, less firmware reservations"}
  reserved: {cpu: "2", memory: 8Gi, src: "assumed:typical kubelet reservation"}
pci:
  - {class: "0x030000", vendor: "0x1a03", src: "assumed:BMC VGA on a typical server board"}
cpu:
  vendorID: {v: GenuineIntel, src: "assumed:CPUID vendor string of every Intel x86 CPU"}
  family: {v: 6, src: "published:intelfamily#95"}
  model: {v: 85, src: "derived:intelfamily#95 INTEL_SKYLAKE_X 0x55, which Cascade Lake shares (corpus8260 cpuinfo reads model 85)"}
  stepping: {v: 7, src: "assumed:the Cascade Lake stepping of the corpus8260 capture"}
  modelName: {v: "Intel(R) Xeon(R) Platinum 9282 CPU @ 2.60GHz", src: "derived:corpus8260#brand string format 'Intel(R) Xeon(R) Platinum 8260 CPU @ 2.40GHz' with the ark9282 SKU and base frequency"}
  sockets: {v: 2, src: "derived:ark9282#Scalability 2, the largest configuration"}
  diesPerPackage: {v: 2, src: "assumed:two 28-core dies per package; raplcommon#1720-1724 states CLX-AP counts package energy per die, so a package has more than one"}
  coresPerSocket: {v: 56, src: published:ark9282}
  threadsPerCore: {v: 2, src: "derived:ark9282#112 threads / 56 cores"}
  numbering: socket-major-smt-last
  cpuMHz: {v: 1000.000, src: "assumed:idle reading at the assumed cpuinfo_min_freq, as on the corpus8260 capture"}
powercap:
  controlTypes:
    - name: intel-rapl
      zones:
        - repeat: per-die
          nameFormat: package-%d-die-%d
          enabled: {v: 1, src: "assumed:BIOS enables PL1, as on the corpus8260 capture"}
          energyUnitNJ: {v: 61035, src: "assumed:ESU 14 in MSR_RAPL_POWER_UNIT, as on the corpus8260 capture; formula raplcommon#741"}
          powerUnitUW: {v: 125000, src: "assumed:PU 3, as on the corpus8260 capture"}
          constraints:
            - name: long_term
              powerLimitUW: {v: 200000000, src: "assumed:per-die PL1 at half the ark9282 TDP of 400 W"}
              maxPowerUW: {v: 200000000, src: "assumed:per-die THERMAL_SPEC_POWER at half the ark9282 TDP of 400 W"}
              timeWindowUS: {v: 999424, src: "assumed:the corpus8260 PL1 window"}
              rejectWrites: {v: "", src: "assumed:PL1 not locked by BIOS"}
            - name: short_term
              powerLimitUW: {v: 240000000, src: "assumed:1.2 x the per-die PL1, the corpus8260 PL2/PL1 ratio 198/165"}
              maxPowerUW: {v: 500000000, src: "assumed:2.5 x the per-die PL1, the corpus8260 MAX_POWER/TDP ratio 413/165"}
              timeWindowUS: {v: 976, src: "assumed:the corpus8260 PL2 window"}
              rejectWrites: {v: "", src: "assumed:PL2 not locked by BIOS"}
          children:
            - nameFormat: dram
              enabled: {v: 0, src: "assumed:DRAM limiting left disabled by BIOS, as on the corpus8260 capture"}
              energyUnitNJ: {v: 15300, src: "published:raplmsr#349-354,432"}
              constraints:
                - {src: "assumed:the corpus8260 DRAM limit (machine.yaml writeRejectingZones) for 6 channels; a 9282 die also drives 6 of the package's 12 (ark9282)", name: long_term, powerLimitUW: 0, maxPowerUW: 47250000, timeWindowUS: 976, rejectWrites: disabled}
cpufreq:
  driver: {v: intel_pstate, src: "assumed:intel_pstate binds Intel CPUs with HWP by default (pstate), as on the corpus8260 capture"}
  governor: {v: powersave, src: "assumed:intel_pstate active mode default"}
  availableGovernors: {v: "performance powersave", src: "published:pstate#90-91"}
  cpuinfoMaxKHz: {v: 3800000, src: "published:ark9282#Max Turbo Frequency 3.80 GHz"}
  cpuinfoMinKHz: {v: 1000000, src: "assumed:the corpus8260 idle frequency"}
  baseKHz: {v: 2600000, src: "published:ark9282#base 2.60 GHz"}
  policyGrouping: {v: per-cpu, src: "published:pstate#39-41"}
  driverMode: {v: active, src: "assumed:intel_pstate runs in active mode where the CPU has HWP (pstate612#intel_pstate.c:3248-3263 and the admin guide's defaults)"}
  hwp: {v: true, src: "assumed:active mode with HWP is the default where HWP exists, as on the corpus 8260"}
  epp:
    available: {v: "default performance balance_performance balance_power power", src: "published:pstate612#intel_pstate.c:694-701,808-819"}
    default: {v: balance_performance, src: "assumed:the boot EPP the firmware programs, 128 on server platforms"}
  boostScope: {v: no-turbo, src: "published:pstate612#intel_pstate.c:1511-1560, no_turbo in place of the generic boost"}
  uncore:
    layout: {v: per-die, src: "assumed:the MSR interface of a pre-TPMI Xeon, one domain per die"}
    initialMinKHz: {v: 1200000, src: "assumed:uncore range of a Cascade Lake die, not published"}
    initialMaxKHz: {v: 2400000, src: "assumed:uncore range of a Cascade Lake die, not published"}
physics:
  cpu:
    model: analytic
    maxPkgW: {v: 400, src: "published:ark9282#TDP"}
    idlePkgW: {v: 80, src: "assumed:two dies at the 40 W per package that intel-xeon-2s-rapl assumes; no public figure"}
    alphaUtil: {v: 1.15, src: "assumed:simulator default SIM_ALPHA_UTIL"}
    betaFreq: {v: 1.35, src: "assumed:simulator default SIM_BETA_FREQ"}
    knee: {v: 0.7, src: "assumed:phys default knee of MeasuredCurveCPUModel"}
    freqRampMS: {v: 500, src: "assumed:simulator default SIM_DVFS_RAMP_MS"}
    idleGovernorDeltaW: {v: 0, src: "assumed:no idle cost of a governor that holds the top frequency until one is measured; to sweep from 0 to 5 % of the idle power"}
    eppGain: {v: 1.0, src: "assumed:EPP 0 reaches the maximum frequency at half load under the HWP powersave algorithm; to sweep from 0.5 to 2"}
    eppCeilingDrop: {v: 0.2, src: "assumed:EPP 128 lowers the full-load frequency by 0.2 of the range, between 1 - 1/1.25 and 1 - 1/1.32, the published full-load gaps of EPP 128 to performance and to EPP 32; to sweep from 0 to 0.25"}
  dram: {wattsPerSocket: {v: 16, src: "assumed:twice the 8 W placeholder of a 6-channel socket, for 12 channels"}}
  platform: {otherW: {v: 0, src: "assumed:no psys zone in this profile"}}
  rapl:
    settleTau: timeWindow
    floorW: {v: 0, src: "assumed:MIN_POWER is not exposed in sysfs (raplcommon#479-486); only the frequency floor applies"}
