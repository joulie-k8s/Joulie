# Four H100 SXM5 modules, as on an NVIDIA HGX H100 4-GPU board, on the two
# socket Xeon Gold 6530 host: the NVIDIA GPU path next to an Intel RAPL CPU
# block of a 5th generation Xeon. g363 is a public system of that shape: an
# HGX H100 4-GPU board with two 5th Gen Xeon Scalable sockets of up to 350 W
# TDP, which the 6530's 270 W fits.
schemaVersion: 1
name: nvidia-h100-sxm-4gpu
extends: intel-xeon-6530-2s-rapl
description: 4x H100 SXM5 80GB (HGX H100 4-GPU) on the two socket Xeon Gold 6530 RAPL host, nvidia-smi, GFD labels.
sources:
  h100page:   {kind: published, ref: "https://www.nvidia.com/en-us/data-center/h100/", note: "H100 SXM: Max TDP up to 700W (configurable); server options: NVIDIA HGX H100 partner and NVIDIA-Certified Systems with 4 or 8 GPUs"}
  g363:       {kind: published, ref: "https://download.gigabyte.com/FileList/DataSheet/g363-sr0-aax1_datasheet_v2.0.pdf", note: "GIGABYTE G363-SR0-AAX1 datasheet v2.0: HPC/AI Server, 3U DP HGX H100 4-GPU; NVIDIA HGX H100 with 4 x SXM5 GPUs; 5th Generation Intel Xeon Scalable Processors, dual processor, TDP up to 350W; video integrated in ASPEED AST2600 (fetched 2026-10-06)"}
  gpuburn114: {kind: published, ref: "https://github.com/wilicc/gpu-burn/issues/114", note: "nvidia-smi 550.90.07 table: every GPU named NVIDIA H100 80GB HBM3, each with a 700W cap"}
  smih100:    {kind: published, ref: "https://github.com/utkuozdemir/nvidia_gpu_exporter/blob/f6977bb790011483824091c916da991ae7ca97cf/internal/captures/linux-x86_64__nvidia-h100-80gb-hbm3__590.48.01.txt", note: "nvidia-smi -q, driver 590.48.01, lines 1488-1678: Product Name NVIDIA H100 80GB HBM3, Device Id 0x233010DE; Current, Default and Max Power Limit 700.00 W, Min Power Limit 200.00 W"}
  pciids:     {kind: published, ref: "https://pci-ids.ucw.cz/read/PC/10de/2330", note: "10de:2330 GH100 [H100 SXM5 80GB] (pci.ids 2026.10.01)"}
  nvml:       {kind: published, ref: "https://docs.nvidia.com/deploy/nvml-api/api/group__nvmlDeviceQueries.html", note: "power averaged over 1 s on Ampere (except GA100) or newer; limits in mW"}
  gfd:        {kind: published, ref: "https://github.com/NVIDIA/k8s-device-plugin/blob/d7265fdcf89f/docs/gpu-feature-discovery/README.md", note: "lines 216-242"}
gpus:
  vendor: nvidia
  count: {v: 4, src: "published:g363#NVIDIA HGX H100 with 4 x SXM5 GPUs; h100page lists HGX H100 with 4 or 8 GPUs"}
  product: {v: "NVIDIA H100 80GB HBM3", src: "published:gpuburn114#nvidia-smi name; equals the NVIDIA_H100_SXM alias of the hardware catalog"}
  pci:
    vendor: {v: "0x10de", src: "published:pciids#10de"}
    device: {v: "0x2330", src: "published:pciids#10de:2330"}
    class: {v: "0x030200", src: "assumed:3D controller, as NVIDIA's display-less data center boards enumerate; no public SXM5 class code"}
  exposure: {v: whole, src: "assumed:no MIG and no sharing configured"}
  labeller: {v: gfd, src: published:gfd}
  limits:
    maxW: {v: 700, src: published:h100page}
    defaultW: {v: 700, src: "published:smih100#Default Power Limit 700.00 W"}
    minW: {v: 200, src: "published:smih100#Min Power Limit 200.00 W"}
  tools: [{name: nvidia-smi, variant: default}]
physics:
  gpu:
    idleW: {v: 70, src: "assumed:placeholder"}
    naturalMaxW: {v: 700, src: published:h100page}
    computeGamma: {v: 1.0, src: "assumed:simulator default SIM_GPU_COMPUTE_GAMMA; throughput only"}
    memoryEpsilon: {v: 0.2, src: "assumed:simulator default SIM_GPU_MEMORY_EPSILON; throughput only"}
    memoryGamma: {v: 1.2, src: "assumed:simulator default SIM_GPU_MEMORY_GAMMA; throughput only"}
    capSettleTauMS: {v: 150, src: "assumed:simulator default SIM_GPU_CAP_APPLY_TAU_MS"}
    telemetryWindowMS: {v: 1000, src: published:nvml}
