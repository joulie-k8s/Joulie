# Four H100 SXM5 modules, as on an NVIDIA HGX H100 4-GPU board, on the two
# socket Xeon Gold 6530 host: the NVIDIA GPU path next to an Intel RAPL CPU
# block of a 5th generation Xeon. g363 is a public system of that shape: an
# HGX H100 4-GPU board with two 5th Gen Xeon Scalable sockets of up to 350 W
# TDP, which the 6530's 270 W fits.
schemaVersion: 1
name: nvidia-h100-sxm-4gpu
extends: intel-xeon-6530-2s-rapl
description: 4x H100 SXM5 80GB (HGX H100 4-GPU) on the two socket Xeon Gold 6530 RAPL host, nvidia-smi, GFD labels.
sources:
  cudagpus:   {kind: published, ref: "https://developer.nvidia.com/cuda-gpus", note: "compute capability: H100 9.0"}
  nvsmiqsxm:  {kind: measured, ref: "read-only nvidia-smi -q of a node with 4x H100 SXM, 2026-10", note: "GPU Power Readings, Persistence Mode, an idle GPU's Average Power Draw"}
  gfdlabelssxm: {kind: measured, ref: "read-only node description of a node with 4x H100 SXM, 2026-10", note: "GPU feature discovery labels gpu.family and gpu.memory"}
  h100page:   {kind: published, ref: "https://www.nvidia.com/en-us/data-center/h100/", note: "H100 SXM: Max TDP up to 700W (configurable); server options: NVIDIA HGX H100 partner and NVIDIA-Certified Systems with 4 or 8 GPUs"}
  g363:       {kind: published, ref: "https://download.gigabyte.com/FileList/DataSheet/g363-sr0-aax1_datasheet_v2.0.pdf", note: "GIGABYTE G363-SR0-AAX1 datasheet v2.0: HPC/AI Server, 3U DP HGX H100 4-GPU; NVIDIA HGX H100 with 4 x SXM5 GPUs; 5th Generation Intel Xeon Scalable Processors, dual processor, TDP up to 350W; video integrated in ASPEED AST2600 (fetched 2026-10-06)"}
  gpuburn114: {kind: published, ref: "https://github.com/wilicc/gpu-burn/issues/114", note: "nvidia-smi 550.90.07 table: every GPU named NVIDIA H100 80GB HBM3, each with a 700W cap"}
  smih100:    {kind: published, ref: "https://github.com/utkuozdemir/nvidia_gpu_exporter/blob/f6977bb790011483824091c916da991ae7ca97cf/internal/captures/linux-x86_64__nvidia-h100-80gb-hbm3__590.48.01.txt", note: "nvidia-smi -q, driver 590.48.01, lines 1488-1678: Product Name NVIDIA H100 80GB HBM3, Device Id 0x233010DE; Current, Default and Max Power Limit 700.00 W, Min Power Limit 200.00 W"}
  pciids:     {kind: published, ref: "https://pci-ids.ucw.cz/read/PC/10de/2330", note: "10de:2330 GH100 [H100 SXM5 80GB] (pci.ids 2026.10.01)"}
  nvml:       {kind: published, ref: "https://docs.nvidia.com/deploy/nvml-api/api/group__nvmlDeviceQueries.html", note: "power averaged over 1 s on Ampere (except GA100) or newer; limits in mW"}
  gfd:        {kind: published, ref: "https://github.com/NVIDIA/k8s-device-plugin/blob/d7265fdcf89f/docs/gpu-feature-discovery/README.md", note: "lines 216-242"}
  smih100clk: {kind: published, ref: "https://github.com/utkuozdemir/nvidia_gpu_exporter/blob/f6977bb790011483824091c916da991ae7ca97cf/internal/captures/linux-x86_64__nvidia-h100-80gb-hbm3__590.48.01.txt", note: "an H100 80GB HBM3 at driver 590.48.01. Idle nvidia-smi -q: Performance State P0 (line 1571), Clocks SM 345 MHz and Memory 2619 MHz (1695-1699), Max Clocks SM 1980 MHz and Memory 2619 MHz (1708-1712). Idle query-gpu (1740-1741): clocks_event_reasons.active 0x0000000000000001. Under gpu-burn at 100 % utilization, query-gpu (2104-2105): clocks.current.sm 1980 MHz, clocks.current.memory 2619 MHz"}
  nvsmi:      {kind: published, ref: "https://docs.nvidia.com/deploy/nvidia-smi/index.html", note: "-lgc and -lmc require root; -lmc does not work on GPUs based on the Hopper architecture"}
node:
  taints: [{key: nvidia.com/gpu, effect: NoSchedule}]
gpus:
  vendor: nvidia
  count: {v: 4, src: "published:g363#NVIDIA HGX H100 with 4 x SXM5 GPUs; h100page lists HGX H100 with 4 or 8 GPUs"}
  product: {v: "NVIDIA H100 80GB HBM3", src: "published:gpuburn114#nvidia-smi name; equals the NVIDIA_H100_SXM alias of the hardware catalog"}
  pci:
    vendor: {v: "0x10de", src: "published:pciids#10de"}
    device: {v: "0x2330", src: "published:pciids#10de:2330"}
    class: {v: "0x030200", src: "assumed:3D controller, as NVIDIA's display-less data center boards enumerate; no public SXM5 class code"}
  exposure: {v: whole, src: "assumed:no MIG and no sharing configured"}
  labeller: {v: gfd, src: published:gfd}
  architecture: {v: hopper, src: measured:gfdlabelssxm}
  persistenceMode: {v: enabled, src: measured:nvsmiqsxm}
  computeCapability: {v: "9.0", src: published:cudagpus}
  memoryMiB: {v: 81559, src: measured:gfdlabelssxm}
  migCapable: {v: true, src: "published:h100page#Multi-Instance GPU, up to 7"}
  limits:
    maxW: {v: 700, src: published:h100page}
    defaultW: {v: 700, src: "published:smih100#Default Power Limit 700.00 W"}
    minW: {v: 200, src: "published:smih100#Min Power Limit 200.00 W"}
  # A real nvidia-smi runs only with its ELF loader, the shared libraries
  # it links and the NVML library present; fakesmi checks them, in this
  # order, under HWEMU_ROOTFS.
  tools:
    - name: nvidia-smi
      variant: default
      requires:
        - paths: [/lib64/ld-linux-x86-64.so.2]
          exit: 127
          src: "assumed:nvidia-smi is a dynamically linked x86-64 ELF with this interpreter (check with file $(command -v nvidia-smi)); without it exec fails with ENOENT, which a shell reports as exit 127"
        - paths: [/lib/x86_64-linux-gnu/libpthread.so.0, /usr/lib/x86_64-linux-gnu/libpthread.so.0, /lib64/libpthread.so.0, /usr/lib64/libpthread.so.0]
          exit: 127
          stderr: "nvidia-smi: error while loading shared libraries: libpthread.so.0: cannot open shared object file: No such file or directory"
          src: "assumed:the shared libraries ldd lists for nvidia-smi, in its order (libpthread.so.0, libm.so.6, libdl.so.2, librt.so.1, libc.so.6; check with ldd $(command -v nvidia-smi)); the loader prints this line for the first one it cannot find and exits 127; the directories are the Debian and RHEL ones"
        - paths: [/lib/x86_64-linux-gnu/libm.so.6, /usr/lib/x86_64-linux-gnu/libm.so.6, /lib64/libm.so.6, /usr/lib64/libm.so.6]
          exit: 127
          stderr: "nvidia-smi: error while loading shared libraries: libm.so.6: cannot open shared object file: No such file or directory"
          src: "assumed:as libpthread.so.0"
        - paths: [/lib/x86_64-linux-gnu/libdl.so.2, /usr/lib/x86_64-linux-gnu/libdl.so.2, /lib64/libdl.so.2, /usr/lib64/libdl.so.2]
          exit: 127
          stderr: "nvidia-smi: error while loading shared libraries: libdl.so.2: cannot open shared object file: No such file or directory"
          src: "assumed:as libpthread.so.0"
        - paths: [/lib/x86_64-linux-gnu/librt.so.1, /usr/lib/x86_64-linux-gnu/librt.so.1, /lib64/librt.so.1, /usr/lib64/librt.so.1]
          exit: 127
          stderr: "nvidia-smi: error while loading shared libraries: librt.so.1: cannot open shared object file: No such file or directory"
          src: "assumed:as libpthread.so.0"
        - paths: [/lib/x86_64-linux-gnu/libc.so.6, /usr/lib/x86_64-linux-gnu/libc.so.6, /lib64/libc.so.6, /usr/lib64/libc.so.6]
          exit: 127
          stderr: "nvidia-smi: error while loading shared libraries: libc.so.6: cannot open shared object file: No such file or directory"
          src: "assumed:as libpthread.so.0"
        - paths: [/usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1, /usr/lib64/libnvidia-ml.so.1]
          exit: 12
          stderr: "NVIDIA-SMI couldn't find libnvidia-ml.so library in your system. Please make sure that the NVIDIA Display Driver is properly installed and present in your system.\nPlease also try adding directory that contains libnvidia-ml.so to your system PATH."
          src: "published:nvsmi#RETURN VALUE, Return code 12 - NVML Shared Library couldn't be found or loaded; the library paths (Debian and RHEL layouts) and the stderr text are assumed"
  clocks:
    sm:
      minMHz: {v: 345, src: "assumed:the idle SM clock (smih100clk), taken as the lowest supported clock"}
      maxMHz: {v: 1980, src: "published:smih100clk#Max Clocks SM 1980 MHz"}
      idleMHz: {v: 345, src: "published:smih100clk#Clocks SM 345 MHz at idle"}
      sustainedMaxMHz: {v: 1980, src: "published:smih100clk#clocks.current.sm 1980 MHz under gpu-burn at 100 % utilization"}
    mem:
      minMHz: {v: 2619, src: "published:smih100clk#Max Clocks Memory 2619 MHz; HBM3 runs at its one clock"}
      maxMHz: {v: 2619, src: "published:smih100clk#Max Clocks Memory 2619 MHz"}
      idleMHz: {v: 2619, src: "published:smih100clk#Clocks Memory 2619 MHz at idle"}
      runtimeLock: {v: false, src: "published:nvsmi#-lmc does not work on GPUs based on the Hopper architecture"}
    idlePState: {v: P0, src: "published:smih100clk#Performance State P0 at idle"}
    supported:
      smMHz:
        v: [1980, 1965, 1950, 1935, 1920, 1905, 1890, 1875, 1860, 1845, 1830, 1815, 1800, 1785,
            1770, 1755, 1740, 1725, 1710, 1695, 1680, 1665, 1650, 1635, 1620, 1605, 1590, 1575,
            1560, 1545, 1530, 1515, 1500, 1485, 1470, 1455, 1440, 1425, 1410, 1395, 1380, 1365,
            1350, 1335, 1320, 1305, 1290, 1275, 1260, 1245, 1230, 1215, 1200, 1185, 1170, 1155,
            1140, 1125, 1110, 1095, 1080, 1065, 1050, 1035, 1020, 1005, 990, 975, 960, 945, 930,
            915, 900, 885, 870, 855, 840, 825, 810, 795, 780, 765, 750, 735, 720, 705, 690, 675,
            660, 645, 630, 615, 600, 585, 570, 555, 540, 525, 510, 495, 480, 465, 450, 435, 420,
            405, 390, 375, 360, 345]
        src: "assumed:15 MHz steps from sm.minMHz to sm.maxMHz; capture nvidia-smi -q -d SUPPORTED_CLOCKS to check"
      memMHz: {v: [2619], src: "published:smih100clk#Max Clocks Memory 2619 MHz"}
    lockFloorAtIdle: {v: true, src: "assumed:an idle GPU sits at the lower bound of its lock; to measure with a lock floor and no load"}
    locksResetOnDeinit: {v: false, src: "assumed:the driver persistence documentation lists the power limit, not the locks, among the settings a GPU initialization resets; to measure"}
  transfer:
    peerLinkGBps: {v: 450, src: "assumed:half the NVLink 900GB/s of h100page, which counts both directions; on a 4-GPU board every GPU links to the other three"}
    receiverGate:
      enabled: {v: false, src: "assumed:no receiver gate measured on this family; off in every repository profile"}
physics:
  gpu:
    idleW: {v: 69.6, src: "measured:nvsmiqsxm#an idle GPU's Average Power Draw"}
    naturalMaxW: {v: 700, src: published:h100page}
    computeGamma: {v: 1.0, src: "assumed:simulator default SIM_GPU_COMPUTE_GAMMA; throughput only"}
    memoryEpsilon: {v: 0.2, src: "assumed:simulator default SIM_GPU_MEMORY_EPSILON; throughput only"}
    memoryGamma: {v: 1.2, src: "assumed:simulator default SIM_GPU_MEMORY_GAMMA; throughput only"}
    capSettleTauMS: {v: 150, src: "assumed:simulator default SIM_GPU_CAP_APPLY_TAU_MS"}
    telemetryWindowMS: {v: 1000, src: published:nvml}
    clockBeta: {v: 1.5, src: "assumed:dynamic power falls faster than the compute clock, as the voltage falls with it; to sweep from 1.0 to 2.5"}
    memoryKneeFrac: {v: 0.65, src: "assumed:memory-bound work keeps its speed down to 0.65 of the maximum compute clock, between the 0.41 and 0.87 where published memory-bound clock sweeps stop being flat"}
    memoryKneeGamma: {v: 1.0, src: "assumed:below the knee memory-bound work slows in proportion to the clock"}
    dataPathHoldW: {v: 0.0, src: "assumed:the HBM clock sits at its one rated clock at idle whatever the preset (mem.minMHz equals mem.maxMHz), so a held data path costs nothing idleW does not include"}
    gatingOffIdleW: {v: 0.0, src: "assumed:no NVIDIA preset turns idle gating off"}
    dataPathGamma: {v: 0.3, src: "assumed:memory-bound work loses 0.3 of its speed with the data path at its lowest level"}
