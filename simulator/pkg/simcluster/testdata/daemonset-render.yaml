# The agent DaemonSet of the Joulie chart as the simulated cluster scripts
# render it (scripts/simcluster/lib.sh sim_agents):
#   helm template joulie charts/joulie -n joulie-system -f values/simcluster.yaml \
#     --set agent.mode=daemonset --show-only templates/agent-daemonset.yaml
# Regenerate it with that command when the chart changes.
---
# Source: joulie/templates/agent-daemonset.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: joulie-agent
  namespace: joulie-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: joulie-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: joulie-agent
    spec:
      serviceAccountName: joulie-agent
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        joulie.io/managed: "true"
      containers:
        - name: agent
          image: "joulie.local/joulie-agent:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: METRICS_ADDR
              value: ":8080"
            - name: RECONCILE_INTERVAL
              value: "20s"
            - name: SIMULATE_ONLY
              value: "false"
          securityContext:
            privileged: true
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: true
          volumeMounts:
            - name: host-sys
              mountPath: /host-sys
      volumes:
        - name: host-sys
          hostPath:
            path: /sys
            type: Directory
