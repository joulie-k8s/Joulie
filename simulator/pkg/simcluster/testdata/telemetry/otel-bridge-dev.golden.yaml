---
# Generated by simcluster telemetry --part prom-config --mode otel-bridge --scope components --timing dev.
global:
  scrape_interval: 5s
storage:
  tsdb:
    out_of_order_time_window: 30m
otlp:
  promote_resource_attributes: [k8s.node.name, host.name]
  translation_strategy: UnderscoreEscapingWithSuffixes
scrape_configs:
  - job_name: joulie
    kubernetes_sd_configs:
      - role: endpointslice
        namespaces:
          names: [joulie-system]
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
        regex: "true"
        action: keep
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
        regex: (.+)
        target_label: __metrics_path__
      - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_service_name]
        target_label: service
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
---
# Generated by simcluster telemetry --part otelcol-config --mode otel-bridge --scope components --timing dev.
receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: kepler
          scrape_interval: 5s
          metrics_path: /exporters/kepler-0.12/metrics
          static_configs:
            - targets: ['joulie-telemetry-sim.joulie-sim:80']
          metric_relabel_configs:
            - source_labels: [__name__, zone]
              regex: kepler_node_cpu_watts;package(-[0-9]+-die-[0-9]+)?
              action: keep
        - job_name: dcgm-exporter
          scrape_interval: 5s
          metrics_path: /exporters/dcgm-4.8.4/metrics
          static_configs:
            - targets: ['joulie-telemetry-sim.joulie-sim:80']
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: DCGM_FI_DEV_(TOTAL_ENERGY_CONSUMPTION|POWER_USAGE)
              action: keep
        - job_name: amd-device-metrics-exporter
          scrape_interval: 5s
          metrics_path: /exporters/amd-dme-1.5.2/metrics
          static_configs:
            - targets: ['joulie-telemetry-sim.joulie-sim:80']
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: gpu_(energy_consumed|power_usage)
              action: keep
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
service:
  extensions: [health_check]
---
# Generated by simcluster telemetry --part sim-values --mode otel-bridge --scope components --timing dev.
emulate:
  exporters:
    - kepler-0.12
    - dcgm-4.8.4
    - amd-dme-1.5.2
extraEnv:
  SIM_KEPLER012_GPU: "true"
otel:
  exportIntervalMillis: 5000
  metricsEndpoint: ""
---
# Generated by simcluster telemetry --part joulie-values --mode otel-bridge --scope components --timing dev.
agent:
  env:
    RECONCILE_INTERVAL: 5s
    SPEC_READ_TIMEOUT: 1m
controllerManager:
  env:
    NODE_POWER_SOURCE: prometheus
    PROMETHEUS_RATE_WINDOW: 30s
    RECONCILE_INTERVAL: 10s
---
# checks, scope components:
{
  "nodeLabel": "k8s_node_name",
  "joulieTruth": "packages+gpus",
  "checks": [
    {
      "id": "otel-components-labels",
      "query": "sum by (k8s_node_name) (max by (k8s_node_name, hw_type, hw_id) (rate(hw_energy_joules_total{hw_type=~\"cpu|gpu\"}[30s])) or on (k8s_node_name, hw_type, hw_id) max by (k8s_node_name, hw_type, hw_id) (hw_power_watts{hw_type=~\"cpu|gpu\"}))",
      "truth": "packages+gpus",
      "tolerance": 0.03,
      "absFloorW": 1
    },
    {
      "id": "otel-components-target-info",
      "query": "sum by (k8s_node_name) (max by (k8s_node_name, hw_type, hw_id) (rate(hw_energy_joules_total{hw_type=~\"cpu|gpu\"}[30s]) * on (job, instance) group_left (k8s_node_name) max by (job, instance, k8s_node_name) (target_info and on (job, instance) rate(hw_energy_joules_total{hw_type=~\"cpu|gpu\"}[30s]))) or on (k8s_node_name, hw_type, hw_id) max by (k8s_node_name, hw_type, hw_id) (hw_power_watts{hw_type=~\"cpu|gpu\"} * on (job, instance) group_left (k8s_node_name) max by (job, instance, k8s_node_name) (target_info and on (job, instance) hw_power_watts{hw_type=~\"cpu|gpu\"})))",
      "truth": "packages+gpus",
      "tolerance": 0.03,
      "absFloorW": 1
    }
  ]
}
---
# wait, scope components:
{"query":"count by (instance) (hw_power_watts{hw_type=\"cpu\", job=\"kepler\"})","label":"instance","nodes":[]}
---
# scope host: power scope host needs an otel mode that carries whole-node power, not otel-bridge
