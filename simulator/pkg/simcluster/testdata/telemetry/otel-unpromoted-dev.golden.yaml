---
# Generated by simcluster telemetry --part prom-config --mode otel-unpromoted --scope components --timing dev.
global:
  scrape_interval: 5s
storage:
  tsdb:
    out_of_order_time_window: 30m
otlp:
  promote_resource_attributes: []
  translation_strategy: UnderscoreEscapingWithSuffixes
scrape_configs:
  - job_name: joulie
    kubernetes_sd_configs:
      - role: endpointslice
        namespaces:
          names: [joulie-system]
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
        regex: "true"
        action: keep
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
        regex: (.+)
        target_label: __metrics_path__
      - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_service_name]
        target_label: service
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
---
# otelcol-config, scope components: mode otel-unpromoted runs no Collector; otelcol-config is for modes otel-collector and otel-bridge
---
# Generated by simcluster telemetry --part sim-values --mode otel-unpromoted --scope components --timing dev.
emulate:
  exporters: []
otel:
  exportIntervalMillis: 5000
  metricsEndpoint: http://prometheus-operated.monitoring:9090/api/v1/otlp/v1/metrics
---
# Generated by simcluster telemetry --part joulie-values --mode otel-unpromoted --scope components --timing dev.
agent:
  env:
    RECONCILE_INTERVAL: 5s
    SPEC_READ_TIMEOUT: 1m
controllerManager:
  env:
    ENABLE_FACILITY_METRICS: "true"
    FACILITY_POLL_INTERVAL: 10s
    NODE_POWER_SOURCE: prometheus
    PROMETHEUS_RATE_WINDOW: 30s
    RECONCILE_INTERVAL: 10s
---
# checks, scope components:
{
  "nodeLabel": "k8s_node_name",
  "joulieTruth": "packages+gpus",
  "checks": [
    {
      "id": "otel-components-target-info",
      "query": "sum by (k8s_node_name) (max by (k8s_node_name, hw_type, hw_id) (rate(hw_energy_joules_total{hw_type=~\"cpu|gpu\", job=\"joulie/joulie-simulator\"}[30s]) * on (job, instance) group_left (k8s_node_name) max by (job, instance, k8s_node_name) (target_info{job=\"joulie/joulie-simulator\"})))",
      "truth": "packages+gpus",
      "tolerance": 0.03,
      "absFloorW": 1
    },
    {
      "id": "otel-host-target-info",
      "query": "max by (k8s_node_name) (rate(hw_host_energy_joules_total{job=\"joulie/joulie-simulator\"}[30s]) * on (job, instance) group_left (k8s_node_name) max by (job, instance, k8s_node_name) (target_info{job=\"joulie/joulie-simulator\"}))",
      "truth": "host",
      "tolerance": 0.03,
      "absFloorW": 1
    }
  ]
}
---
# wait, scope components:
{"query":"count by (instance) (hw_energy_joules_total{hw_type=\"cpu\", job=\"joulie/joulie-simulator\"})","label":"instance","nodes":[]}
---
# Generated by simcluster telemetry --part joulie-values --mode otel-unpromoted --scope host --timing dev.
agent:
  env:
    RECONCILE_INTERVAL: 5s
    SPEC_READ_TIMEOUT: 1m
controllerManager:
  env:
    ENABLE_FACILITY_METRICS: "true"
    FACILITY_POLL_INTERVAL: 10s
    NODE_POWER_SCOPE: host
    NODE_POWER_SOURCE: prometheus
    PROMETHEUS_RATE_WINDOW: 30s
    RECONCILE_INTERVAL: 10s
---
# checks, scope host:
{
  "nodeLabel": "k8s_node_name",
  "joulieTruth": "host",
  "checks": [
    {
      "id": "otel-host-target-info",
      "query": "max by (k8s_node_name) (rate(hw_host_energy_joules_total{job=\"joulie/joulie-simulator\"}[30s]) * on (job, instance) group_left (k8s_node_name) max by (job, instance, k8s_node_name) (target_info{job=\"joulie/joulie-simulator\"}))",
      "truth": "host",
      "tolerance": 0.03,
      "absFloorW": 1
    },
    {
      "id": "otel-components-target-info",
      "query": "sum by (k8s_node_name) (max by (k8s_node_name, hw_type, hw_id) (rate(hw_energy_joules_total{hw_type=~\"cpu|gpu\", job=\"joulie/joulie-simulator\"}[30s]) * on (job, instance) group_left (k8s_node_name) max by (job, instance, k8s_node_name) (target_info{job=\"joulie/joulie-simulator\"})))",
      "truth": "packages+gpus",
      "tolerance": 0.03,
      "absFloorW": 1
    }
  ]
}
