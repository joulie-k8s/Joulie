---
# Generated by simcluster telemetry --part prom-config --mode kepler --scope components --timing dev.
global:
  scrape_interval: 5s
storage:
  tsdb:
    out_of_order_time_window: 30m
otlp:
  promote_resource_attributes: [k8s.node.name, host.name]
  translation_strategy: UnderscoreEscapingWithSuffixes
scrape_configs:
  - job_name: joulie
    kubernetes_sd_configs:
      - role: endpointslice
        namespaces:
          names: [joulie-system]
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
        regex: "true"
        action: keep
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
        regex: (.+)
        target_label: __metrics_path__
      - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_service_name]
        target_label: service
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
  - job_name: kepler-0.12
    honor_labels: false
    metrics_path: /exporters/kepler-0.12/metrics
    static_configs:
      - targets: ['joulie-telemetry-sim.joulie-sim:80']
---
# otelcol-config, scope components: mode kepler runs no Collector; otelcol-config is for modes otel-collector and otel-bridge
---
# Generated by simcluster telemetry --part sim-values --mode kepler --scope components --timing dev.
emulate:
  exporters:
    - kepler-0.12
extraEnv:
  SIM_KEPLER012_GPU: "true"
otel:
  exportIntervalMillis: 5000
  metricsEndpoint: http://prometheus-operated.monitoring:9090/api/v1/otlp/v1/metrics
---
# Generated by simcluster telemetry --part joulie-values --mode kepler --scope components --timing dev.
agent:
  env:
    RECONCILE_INTERVAL: 5s
    SPEC_READ_TIMEOUT: 1m
controllerManager:
  env:
    ENABLE_FACILITY_METRICS: "true"
    FACILITY_POLL_INTERVAL: 10s
    NODE_POWER_PRESET: kepler
    NODE_POWER_SOURCE: prometheus
    PROMETHEUS_RATE_WINDOW: 30s
    RECONCILE_INTERVAL: 10s
---
# checks, scope components:
{
  "nodeLabel": "node_name",
  "joulieTruth": "packages+nvidia-gpus",
  "checks": [
    {
      "id": "kepler-0.12-components",
      "query": "sum by (node_name) (label_replace(rate(kepler_node_cpu_active_joules_total{zone=~\"package(-[0-9]+-die-[0-9]+)?\"}[30s]), \"joulie_component\", \"cpu_active\", \"\", \"\") or label_replace(rate(kepler_node_cpu_idle_joules_total{zone=~\"package(-[0-9]+-die-[0-9]+)?\"}[30s]), \"joulie_component\", \"cpu_idle\", \"\", \"\") or label_replace(rate(kepler_node_gpu_joules_total[30s]), \"joulie_component\", \"gpu\", \"\", \"\"))",
      "truth": "packages+nvidia-gpus",
      "tolerance": 0.03,
      "absFloorW": 1
    }
  ]
}
---
# wait, scope components:
{"query":"count by (node_name) (kepler_node_cpu_joules_total)","label":"node_name","nodes":[]}
---
# scope host: power scope host needs an otel mode that carries whole-node power, not kepler
