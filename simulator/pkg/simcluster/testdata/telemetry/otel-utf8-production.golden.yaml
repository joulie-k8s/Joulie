---
# Generated by simcluster telemetry --part prom-config --mode otel-utf8 --scope components --timing production.
global:
  scrape_interval: 1m
storage:
  tsdb:
    out_of_order_time_window: 30m
otlp:
  promote_resource_attributes: [k8s.node.name, host.name]
  translation_strategy: NoUTF8EscapingWithSuffixes
scrape_configs:
  - job_name: joulie
    kubernetes_sd_configs:
      - role: endpointslice
        namespaces:
          names: [joulie-system]
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
        regex: "true"
        action: keep
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
        regex: (.+)
        target_label: __metrics_path__
      - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_service_name]
        target_label: service
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
---
# otelcol-config, scope components: mode otel-utf8 runs no Collector; otelcol-config is for modes otel-collector and otel-bridge
---
# Generated by simcluster telemetry --part sim-values --mode otel-utf8 --scope components --timing production.
emulate:
  exporters: []
otel:
  exportIntervalMillis: 60000
  metricsEndpoint: http://prometheus-operated.monitoring:9090/api/v1/otlp/v1/metrics
---
# Generated by simcluster telemetry --part joulie-values --mode otel-utf8 --scope components --timing production.
agent:
  env:
    RECONCILE_INTERVAL: 20s
    SPEC_READ_TIMEOUT: 5m
controllerManager:
  env:
    ENABLE_FACILITY_METRICS: "true"
    FACILITY_POLL_INTERVAL: 30s
    NODE_POWER_SOURCE: prometheus
    PROMETHEUS_NAME_TRANSLATION: NoUTF8EscapingWithSuffixes
    PROMETHEUS_RATE_WINDOW: 5m
    RECONCILE_INTERVAL: 1m
---
# checks, scope components:
{
  "nodeLabel": "k8s.node.name",
  "joulieTruth": "packages+gpus",
  "checks": [
    {
      "id": "otel-components-labels",
      "query": "sum by (\"k8s.node.name\") (max by (\"k8s.node.name\", \"hw.type\", \"hw.id\") (rate({\"hw.energy_joules_total\", \"hw.type\"=~\"cpu|gpu\", job=\"joulie/joulie-simulator\"}[5m])))",
      "truth": "packages+gpus",
      "tolerance": 0.03,
      "absFloorW": 1
    },
    {
      "id": "otel-components-target-info",
      "query": "sum by (\"k8s.node.name\") (max by (\"k8s.node.name\", \"hw.type\", \"hw.id\") (rate({\"hw.energy_joules_total\", \"hw.type\"=~\"cpu|gpu\", job=\"joulie/joulie-simulator\"}[5m]) * on (job, instance) group_left (\"k8s.node.name\") max by (job, instance, \"k8s.node.name\") (target_info{job=\"joulie/joulie-simulator\"})))",
      "truth": "packages+gpus",
      "tolerance": 0.03,
      "absFloorW": 1
    },
    {
      "id": "otel-host-labels",
      "query": "max by (\"k8s.node.name\") (rate({\"hw.host.energy_joules_total\", job=\"joulie/joulie-simulator\"}[5m]))",
      "truth": "host",
      "tolerance": 0.03,
      "absFloorW": 1
    },
    {
      "id": "otel-host-target-info",
      "query": "max by (\"k8s.node.name\") (rate({\"hw.host.energy_joules_total\", job=\"joulie/joulie-simulator\"}[5m]) * on (job, instance) group_left (\"k8s.node.name\") max by (job, instance, \"k8s.node.name\") (target_info{job=\"joulie/joulie-simulator\"}))",
      "truth": "host",
      "tolerance": 0.03,
      "absFloorW": 1
    }
  ]
}
---
# wait, scope components:
{"query":"count by (instance) ({\"hw.energy_joules_total\", \"hw.type\"=\"cpu\", job=\"joulie/joulie-simulator\"})","label":"instance","nodes":[]}
