# A small cluster spec for the planner tests: 2 CPU nodes, 1 GPU node with
# its vendor's taint, as the GPU profiles carry, which only pods requesting
# nvidia.com/gpu tolerate, and 1 CPU node whose taint no workload pod
# tolerates.
apiVersion: sim.joulie.io/v1alpha1
kind: ClusterSpec
metadata: {name: mini}
spec:
  defaults:
    labels: {joulie.io/managed: "true"}
  pools:
  - {name: intel, profile: intel-xeon-2s-rapl, count: 2}
  - name: nvl
    profile: nvidia-h100-nvl-8gpu
    count: 1
    taints: [{key: nvidia.com/gpu, effect: NoSchedule}]
  - name: intel-tainted
    profile: intel-xeon-2s-rapl
    count: 1
    taints: [{key: example.com/dedicated, value: batch, effect: NoSchedule}]
