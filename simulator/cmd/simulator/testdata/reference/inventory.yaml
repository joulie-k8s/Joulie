# The reference scenario of TestReferenceScenarioStandalone
# (reference_test.go): generic catalogue parts only, one entry per way the
# simulator resolves a node's model. The golden groups energy by entry.
nodes:
  # A measured SPECpower curve (AMD_EPYC_9654 node2S), two replicas.
  - node_name_prefix: ref-cpu-curve
    replicas: 2
    cpu: AMD EPYC 9654 96-Core Processor
    cpu_sockets: 2
    cpu_cores: 192
    memory_gib: 768

  # The same CPU on one socket.
  - node_name: ref-cpu-1s
    cpu: AMD EPYC 9654 96-Core Processor
    cpu_sockets: 1
    cpu_cores: 96
    memory_gib: 384

  # Another measured curve (AMD_EPYC_9655 node2S).
  - node_name: ref-cpu-9655
    cpu: AMD EPYC 9655 96-Core Processor
    cpu_sockets: 2
    cpu_cores: 192
    memory_gib: 768

  # A catalogue entry with a proxy family and no curve of its own.
  - node_name: ref-cpu-proxy
    cpu: AMD EPYC 9534 64-Core Processor
    cpu_sockets: 2
    cpu_cores: 128
    memory_gib: 512

  # An Intel CPU with official figures only: the analytic model.
  - node_name: ref-cpu-intel
    cpu: INTEL XEON PLATINUM 8260
    cpu_sockets: 2
    cpu_cores: 48
    memory_gib: 384

  # Eight catalogue GPUs on an Intel host, capped between 200 and 400 W.
  - node_name: ref-gpu-nvl
    vendor: nvidia
    product: NVIDIA H100 NVL
    cpu: INTEL(R) XEON(R) GOLD 6530
    cpu_sockets: 2
    cpu_cores: 64
    memory_gib: 1024
    gpu_count: 8
    gpu_min_cap_watts: 200
    gpu_max_cap_watts: 400

  # Eight catalogue GPUs on an EPYC host.
  - node_name: ref-gpu-mi300x
    vendor: amd
    product: AMD Instinct MI300X
    cpu: AMD EPYC 9654 96-Core Processor
    cpu_sockets: 2
    cpu_cores: 192
    memory_gib: 1536
    gpu_count: 8
    gpu_min_cap_watts: 400
    gpu_max_cap_watts: 750

  # Four GPUs the catalogue does not know.
  - node_name: ref-gpu-unknown
    vendor: nvidia
    product: Generic PCIe Accelerator
    cpu: AMD EPYC 9534 64-Core Processor
    cpu_sockets: 2
    cpu_cores: 128
    memory_gib: 512
    gpu_count: 4
    gpu_max_cap_watts: 350
