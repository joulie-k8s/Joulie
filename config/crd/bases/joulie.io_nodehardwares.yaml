---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: nodehardwares.joulie.io
spec:
  group: joulie.io
  names:
    kind: NodeHardware
    listKind: NodeHardwareList
    plural: nodehardwares
    shortNames:
    - nhw
    singular: nodehardware
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.nodeName
      name: Node
      type: string
    - jsonPath: .status.cpu.model
      name: CPU
      type: string
    - jsonPath: .status.gpu.model
      name: GPU
      type: string
    - jsonPath: .status.gpu.count
      name: GPUCount
      type: integer
    - jsonPath: .status.quality.overall
      name: Quality
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          NodeHardware holds the hardware capabilities of a node, as published by
          the agent. The spec names the node; the status carries the inventory.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NodeHardwareSpec identifies the node this inventory belongs
              to.
            properties:
              nodeName:
                description: NodeName is the Kubernetes node this inventory describes.
                type: string
            required:
            - nodeName
            type: object
          status:
            description: |-
              NodeHardwareStatus holds the hardware inventory published by the agent.
              It is the single source of truth for static node hardware facts: CPU and
              GPU specs, power cap ranges, frequency landmarks, GPU slicing modes,
              memory, network and inventory resolution confidence.
            properties:
              capabilities:
                description: |-
                  NodeHardwareCapabilities summarises which control and telemetry paths the
                  agent found usable on the node.
                properties:
                  cpuControl:
                    type: boolean
                  cpuTelemetry:
                    type: boolean
                  gpuControl:
                    type: boolean
                  gpuTelemetry:
                    type: boolean
                type: object
              cpu:
                description: NodeHardwareCPU describes the CPU package(s) of the node.
                properties:
                  capRange:
                    description: CapRange is the RAPL/MSR power cap range, per socket.
                    properties:
                      maxWattsPerSocket:
                        type: number
                      minWattsPerSocket:
                        type: number
                      type:
                        description: Type is the cap domain, currently always "package".
                        type: string
                    type: object
                  controlAvailable:
                    type: boolean
                  coresPerSocket:
                    type: integer
                  driverFamily:
                    type: string
                  governor:
                    description: Governor is the CPU frequency governor state the
                      agent discovered.
                    properties:
                      available:
                        description: Available is scaling_available_governors.
                        items:
                          type: string
                        type: array
                      baseline:
                        description: |-
                          Baseline is the state found before the agent's first write, which the
                          agent restores.
                        properties:
                          groups:
                            items:
                              description: CPUGovernorState is the governor state
                                of a group of cpufreq policies.
                              properties:
                                boost:
                                  enum:
                                  - "on"
                                  - "off"
                                  type: string
                                epp:
                                  type: string
                                governor:
                                  type: string
                                policies:
                                  description: |-
                                    Policies lists the policy numbers in the kernel's list form, such as
                                    0-63 or 0,2,4.
                                  type: string
                              type: object
                            type: array
                          recordedAt:
                            description: RecordedAt is the RFC3339 time the baseline
                              was recorded.
                            type: string
                        type: object
                      boost:
                        description: Boost is the frequency boost (turbo) state, when
                          the driver has one.
                        properties:
                          scope:
                            enum:
                            - global
                            - per-cpu
                            - no-turbo
                            type: string
                          state:
                            enum:
                            - "on"
                            - "off"
                            type: string
                        type: object
                      current:
                        description: |-
                          Current is scaling_governor when every policy has the same one, else
                          mixed.
                        type: string
                      driver:
                        description: |-
                          Driver is scaling_driver, such as acpi-cpufreq, intel_pstate or
                          amd-pstate-epp.
                        type: string
                      driverMode:
                        description: |-
                          DriverMode is active, passive or guided, from intel_pstate/status or
                          amd_pstate/status; empty for a driver without modes.
                        type: string
                      epp:
                        description: EPP is the energy-performance preference, when
                          the driver has one.
                        properties:
                          available:
                            description: |-
                              Available is the preferences the policies accept under some governor:
                              energy_performance_available_preferences, except on amd-pstate-epp
                              under the performance governor, where that file lists only performance
                              and the driver's own set is published instead.
                            items:
                              type: string
                            type: array
                          current:
                            description: Current is energy_performance_preference.
                            type: string
                        type: object
                      presets:
                        description: |-
                          Presets lists every preset the node accepts with the result it gives;
                          a preset the node cannot express is left out.
                        items:
                          description: |-
                            GovernorPresetSupport is one preset a node accepts. Result is applied when
                            the preset changes the hardware state, equivalent when it maps to a state
                            the node already expresses another way; Native is the native setting it
                            maps to, in the driver's own words.
                          properties:
                            native:
                              type: string
                            preset:
                              type: string
                            result:
                              enum:
                              - applied
                              - equivalent
                              type: string
                          required:
                          - preset
                          type: object
                        type: array
                      writable:
                        description: Writable is true when the agent can write the
                          governor files.
                        type: boolean
                    type: object
                  landmarks:
                    description: CPULandmarks holds the characteristic frequencies
                      of the CPU.
                    properties:
                      lowestNonlinearFreqMHz:
                        type: number
                      maxBoostMHz:
                        type: number
                      minFreqMHz:
                        type: number
                      nominalFreqMHz:
                        type: number
                    type: object
                  model:
                    type: string
                  rawModel:
                    type: string
                  sockets:
                    type: integer
                  telemetryAvailable:
                    type: boolean
                  totalCores:
                    type: integer
                  vendor:
                    type: string
                  warnings:
                    items:
                      type: string
                    type: array
                type: object
              gpu:
                description: NodeHardwareGPU describes the GPUs of the node.
                properties:
                  capRangePerGpu:
                    description: CapRangePerGPU is the power cap range of one GPU,
                      not the sum over all GPUs.
                    properties:
                      defaultWatts:
                        description: |-
                          DefaultWatts is the limit the driver sets when it loads, NVIDIA's
                          power.default_limit. It is MaxWatts where the driver gives none within
                          the range, and on AMD, whose driver rewrites its default with the cap
                          in force.
                        type: number
                      maxWatts:
                        type: number
                      minWatts:
                        type: number
                    type: object
                  controlAvailable:
                    type: boolean
                  count:
                    type: integer
                  currentCapWatts:
                    type: number
                  governor:
                    description: Governor is the GPU clock governor state the agent
                      discovered.
                    properties:
                      baseline:
                        description: |-
                          Baseline is the state found before the agent's first write, which the
                          agent restores.
                        properties:
                          devices:
                            items:
                              description: |-
                                GPUGovernorDeviceState is the governor state of one GPU, keyed by its PCI
                                bus id (domain:bus:device.function), never by a tool's index, since tools
                                enumerate GPUs in different orders.
                              properties:
                                busId:
                                  type: string
                                level:
                                  description: |-
                                    Level is the amdgpu performance level, or unknown on NVIDIA, where a
                                    clock lock cannot be read back.
                                  type: string
                              required:
                              - busId
                              type: object
                            type: array
                          recordedAt:
                            description: RecordedAt is the RFC3339 time the baseline
                              was recorded.
                            type: string
                        type: object
                      clockRangesMHz:
                        description: ClockRangesMHz is the minimum and maximum of
                          each clock domain.
                        properties:
                          fabric:
                            description: ClockRangeMHz is the lowest and highest clock
                              of a domain, in MHz.
                            properties:
                              max:
                                type: number
                              min:
                                type: number
                            type: object
                          graphics:
                            description: ClockRangeMHz is the lowest and highest clock
                              of a domain, in MHz.
                            properties:
                              max:
                                type: number
                              min:
                                type: number
                            type: object
                          memory:
                            description: ClockRangeMHz is the lowest and highest clock
                              of a domain, in MHz.
                            properties:
                              max:
                                type: number
                              min:
                                type: number
                            type: object
                        type: object
                      current:
                        description: |-
                          Current is the native state: the amdgpu performance level, or on
                          NVIDIA the agent's own record of its locks, unknown without one (a
                          clock lock cannot be read back).
                        type: string
                      mechanism:
                        description: |-
                          Mechanism is how the agent reads and sets the governor: amdgpu-sysfs
                          or nvidia-smi.
                        enum:
                        - amdgpu-sysfs
                        - nvidia-smi
                        type: string
                      presets:
                        description: |-
                          Presets lists every preset the GPUs accept with the result it gives;
                          a preset the family cannot express is left out.
                        items:
                          description: |-
                            GovernorPresetSupport is one preset a node accepts. Result is applied when
                            the preset changes the hardware state, equivalent when it maps to a state
                            the node already expresses another way; Native is the native setting it
                            maps to, in the driver's own words.
                          properties:
                            native:
                              type: string
                            preset:
                              type: string
                            result:
                              enum:
                              - applied
                              - equivalent
                              type: string
                          required:
                          - preset
                          type: object
                        type: array
                      uniform:
                        description: Uniform is true when every GPU of the node is
                          in the same state.
                        type: boolean
                      writable:
                        description: Writable is true when the agent can set the governor.
                        type: boolean
                    type: object
                  model:
                    type: string
                  powerDomains:
                    description: |-
                      PowerDomains is the number of GPUs that hold a power limit of their
                      own, published only when it is below Count: on a two-die AMD package
                      such as an MI250X both dies are counted, and only the primary holds a
                      limit, which bounds the package. Absent, every counted GPU holds its
                      own.
                    minimum: 0
                    type: integer
                  present:
                    type: boolean
                  rawModel:
                    type: string
                  slicing:
                    description: GPUSlicing lists the partitioning modes the GPUs
                      support.
                    properties:
                      modes:
                        items:
                          type: string
                        type: array
                      supported:
                        type: boolean
                    type: object
                  telemetryAvailable:
                    type: boolean
                  vendor:
                    type: string
                  warnings:
                    items:
                      type: string
                    type: array
                type: object
              inventoryResolution:
                description: |-
                  InventoryResolution records how confidently the detected hardware was
                  matched against the hardware catalog.
                properties:
                  exactness:
                    description: |-
                      CatalogExactness is the match quality per component: "exact", "proxy" or
                      "generic".
                    properties:
                      cpu:
                        type: string
                      gpu:
                        type: string
                    type: object
                  hardwareCatalogKey:
                    description: CatalogKey is the catalog entry the CPU and GPU resolved
                      to.
                    properties:
                      cpu:
                        type: string
                      gpu:
                        type: string
                    type: object
                type: object
              memory:
                description: NodeHardwareMemory describes the system memory of the
                  node.
                properties:
                  totalBytes:
                    format: int64
                    type: integer
                type: object
              network:
                description: NodeHardwareNetwork describes the network attachment
                  of the node.
                properties:
                  linkClass:
                    type: string
                type: object
              quality:
                description: |-
                  NodeHardwareQuality rates the inventory as a whole: "exact" when the CPU
                  model and, on a GPU node, the GPU model are known, "heuristic" when only a
                  raw model string is, "unavailable" when neither is, with the warnings that
                  lowered it.
                properties:
                  overall:
                    type: string
                  warnings:
                    items:
                      type: string
                    type: array
                type: object
              updatedAt:
                description: UpdatedAt is the RFC3339 time of the last inventory write.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
