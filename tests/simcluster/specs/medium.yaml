# Medium cluster for the nightly run: 50 Nodes, of which 48 get an agent.
# The pools are chosen for coverage, not to mirror any deployment: every
# builtin hardware family with at least 2 Nodes, and one pool per case the
# smoke spec leaves out (GPU sharing, no NFD labels, no GPU driver tools, GPU
# Nodes with a taint of their own, Nodes Joulie does not manage).
# Every profile is builtin; local profiles never appear in a committed spec.
apiVersion: sim.joulie.io/v1alpha1
kind: ClusterSpec
metadata: {name: medium}
spec:
  defaults:
    labels: {joulie.io/managed: "true"}
    baseLoad: {cpuUtil: 0.8, gpuUtil: 0.9, memoryIntensity: 0.2, cpuClass: cpu.compute_bound, gpuClass: gpu.compute_bound}
  pools:
  - {name: intel, profile: intel-xeon-2s-rapl, count: 12}
  # No NFD labels: the agent sees no CPU vendor and falls back to DVFS.
  - {name: intel-nonfd, profile: intel-xeon-2s-rapl, count: 2, overrides: {nfd: absent}}
  - {name: epyc, profile: amd-epyc-2s-energy-only, count: 8}
  - {name: epyc-hsmp, profile: amd-epyc-2s-hsmp, count: 4}
  - {name: nvl, profile: nvidia-h100-nvl-8gpu, count: 4}
  # MIG 1g.12gb x7: NVIDIA MIG User Guide supported-mig-profiles.html, table "H100 94GB product (PCIe and SXM5)"
  - {name: nvl-mig, profile: nvidia-h100-nvl-8gpu, count: 2, overrides: {gpus: {exposure: mig-mixed, migProfile: 1g.12gb, migDevicesPerGPU: 7}}}
  # The harness section below gives these Nodes no driver stub, so the GPU tools fail.
  - {name: nvl-nodriver, profile: nvidia-h100-nvl-8gpu, count: 2}
  # GPU Nodes reserved by a taint of their own, beside the GPU vendor taint the profile sets: the
  # agent tolerates every taint, so it enforces the caps Joulie plans here.
  - {name: nvl-tainted, profile: nvidia-h100-nvl-8gpu, count: 2, taints: [{key: example.com/dedicated, value: gpu, effect: NoSchedule}]}
  - {name: sxm, profile: nvidia-h100-sxm-8gpu, count: 2}
  # Time-slicing with renamed resources, 4 replicas: the example of the NVIDIA GPU Operator
  # documentation, gpu-sharing.html ("Time-Slicing GPUs in Kubernetes").
  - {name: sxm-shared, profile: nvidia-h100-sxm-8gpu, count: 2, overrides: {gpus: {exposure: timeslice-rename, timesliceReplicas: 4}}}
  - {name: mi300x, profile: amd-instinct-mi300x-8gpu, count: 2}
  # Display-class AMD GPUs whose power cap the driver pins at 241 W: the agent finds them
  # through NFD's pci-0300_1002 and can set no other cap.
  - {name: w7900, profile: amd-radeon-pro-w7900-4gpu, count: 2}
  - {name: vm, profile: vm-no-powercap, count: 4}
  # Not managed: no agent and no NodeTwin, while the simulator still reports their power.
  - {name: unmanaged, profile: intel-xeon-2s-rapl, count: 2, labels: {joulie.io/managed: "false"}}
  # Every GPU pool but nvl-nodriver gets the GPU tools a node with the driver
  # installed has (a driver stub at each path the tools need). A pool left out follows the
  # Joulie install, which by default delivers none (agent.runtimeClassName and
  # agent.extraVolumes unset), so its agent's NVIDIA GPU inventory fails.
  harness:
    pools:
      nvl: {toolDelivery: mounted}
      nvl-mig: {toolDelivery: mounted}
      nvl-nodriver: {toolDelivery: none}
      nvl-tainted: {toolDelivery: mounted}
      sxm: {toolDelivery: mounted}
      sxm-shared: {toolDelivery: mounted}
      mi300x: {toolDelivery: mounted}
      w7900: {toolDelivery: mounted}
