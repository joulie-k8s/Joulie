# One ServiceMonitor per Joulie Service with metrics. The chart creates the
# Services; their port is named metrics.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: joulie-agent
  namespace: joulie-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: joulie-agent
  endpoints:
    - port: metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: joulie-controller-manager
  namespace: joulie-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: joulie-controller-manager
  endpoints:
    - port: metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: joulie-scheduler-extender
  namespace: joulie-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: scheduler-extender
  endpoints:
    - port: metrics
      interval: 15s
