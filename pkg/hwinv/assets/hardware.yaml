gpuModels:
  NVIDIA_H100_NVL:
    aliases: ["NVIDIA-H100-NVL", "NVIDIA H100 NVL", "H100 NVL"]
    provenance: official+runtime+literature
    official:
      vendor: nvidia
      maxBoardPowerW: 400
      # The H100 NVL product brief (PB-11773-001_v01, Table 1) gives 400 W
      # maximum (default) and 200 W minimum.
      minBoardPowerW: 200
  NVIDIA_H100_SXM:
    aliases: ["NVIDIA-H100-80GB-HBM3", "NVIDIA H100 80GB HBM3", "H100 SXM"]
    provenance: official+runtime+literature
    official:
      vendor: nvidia
      maxBoardPowerW: 700
      # The lowest vendor-set limit, not a datasheet minimum: NVIDIA's MLPerf
      # Inference v4.0 DGX-H100 MaxQ configs set power_limit = 300.
      minBoardPowerW: 300
  NVIDIA_L40S:
    aliases: ["NVIDIA-L40S", "NVIDIA L40S", "L40S"]
    provenance: official+runtime+literature
    official:
      vendor: nvidia
      maxBoardPowerW: 350
      # No public minimum: the L40S product brief (PB-11470-001_v02) says "TBD".
      minBoardPowerW: 200
  AMD_INSTINCT_MI300X:
    # AMD_Instinct_MI300X_OAM is how the AMD GPU labeller names it in
    # amd.com/gpu.product-name.
    aliases: ["AMD_Instinct_MI300X", "AMD Instinct MI300X", "MI300X", "AMD_Instinct_MI300X_OAM"]
    provenance: official+runtime+literature
    official:
      vendor: amd
      maxBoardPowerW: 750
      # The lowest limit a public study saw enforced: below 400 W the GPUs drew
      # more than configured (arXiv 2603.16164).
      minBoardPowerW: 400
  AMD_RADEON_PRO_W7900:
    aliases: ["AMD_Radeon_PRO_W7900", "AMD Radeon PRO W7900", "W7900"]
    provenance: official+runtime+literature
    official:
      vendor: amd
      maxBoardPowerW: 295
      # No public minimum: AMD publishes only the 295 W total board power.
      minBoardPowerW: 200
  INTEL_DATA_CENTER_GPU_FLEX_170:
    # Flex_170 is how Intel's NFD rules name it in gpu.intel.com/product; the
    # others are the Intel and pci.ids names of device 8086:56c0.
    aliases: ["Intel Data Center GPU Flex 170", "Data Center GPU Flex 170", "Flex_170"]
    provenance: official
    official:
      vendor: intel
      # TBP 150 W (Intel product specifications, SKU 230019). No public
      # minimum: Level Zero Sysman reports the minimum limit as unknown, so
      # minBoardPowerW is left out.
      maxBoardPowerW: 150
  INTEL_DATA_CENTER_GPU_MAX_1100:
    aliases: ["Intel Data Center GPU Max 1100", "Data Center GPU Max 1100", "Max_1100"]
    provenance: official
    official:
      vendor: intel
      # TDP 300 W (Intel product specifications, SKU 232876). No public
      # minimum: Level Zero Sysman reports the minimum limit as unknown, so
      # minBoardPowerW is left out.
      maxBoardPowerW: 300
  INTEL_DATA_CENTER_GPU_MAX_1550:
    aliases: ["Intel Data Center GPU Max 1550", "Data Center GPU Max 1550", "Max_1550"]
    provenance: official
    official:
      vendor: intel
      # TDP 600 W (Intel product specifications, SKU 232873). No public
      # minimum: Level Zero Sysman reports the minimum limit as unknown, so
      # minBoardPowerW is left out.
      maxBoardPowerW: 600
